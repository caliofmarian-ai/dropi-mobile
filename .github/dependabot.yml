version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # TEMPORARY AUDIT FREEZE — 2026-09-12
    # Version-update PR generation is paused while the canonical coverage audit
    # (#371 / #287) is rebuilt on a stable main. Security updates remain governed
    # by GitHub's security-update path. Restore grouped version updates when the
    # audit/reorganization pass is merged.
    open-pull-requests-limit: 0
    # Expo, React and React Native runtime/native modules/tooling are
    # compatibility-coupled to the current Expo SDK line. Patch updates remain
    # eligible where appropriate, while runtime/SDK-generation jumps are
    # handled as one reviewed migration with Android build/runtime validation.
    # Express major upgrades are also explicit framework migrations because
    # route syntax and request parameter contracts can change across majors.
    ignore:
      - dependency-name: "expo"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "expo-*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint-config-expo"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "@types/react"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "react-native"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "react-native-safe-area-context"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "react-native-svg"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "express"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/express"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
