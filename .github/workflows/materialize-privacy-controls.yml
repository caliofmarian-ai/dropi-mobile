name: Materialize privacy controls

on:
  push:
    branches: [m2/privacy-controls]
    paths:
      - '.github/workflows/materialize-privacy-controls.yml'
      - 'scripts/materialize_privacy_controls.py'
      - 'shared/privacy-policy.ts'
      - 'server/privacy-router.ts'
      - 'server/privacy-retention-service.ts'
      - 'app/privacy.tsx'
      - 'tests/privacy-policy.test.ts'
      - 'tests/privacy-controls-contract.test.ts'
      - 'drizzle/0015_privacy_controls.sql'
      - 'drizzle/meta/_journal.json'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2/privacy-controls
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize schema and application wiring
        run: python scripts/materialize_privacy_controls.py
      - name: Privacy policy and contract tests
        run: >-
          node --import tsx --test
          tests/privacy-policy.test.ts
          tests/privacy-controls-contract.test.ts
          tests/audit-policy.test.ts
          tests/request-session.test.ts
          tests/audit-capture-attribution.test.ts
          tests/c1-audit-separation-contract.test.ts
          tests/audit-investigator-export.test.ts
      - name: Operational regressions
        run: >-
          pnpm exec vitest run
          tests/sdk.authenticate-request.test.ts
          tests/auth.logout.test.ts
          tests/order-state-machine.test.ts
          tests/order-management-integration-contract.test.ts
          tests/marketplace-controls-integration-contract.test.ts
          tests/live-tracking-security.test.ts
          tests/operational-safety-certification.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Whitespace
        run: git diff --check
      - name: Commit verified privacy controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-privacy-controls.yml scripts/materialize_privacy_controls.py
          git add drizzle shared server app tests
          git commit -m "feat: deliver canonical privacy consent and retention controls"
          git push origin HEAD:m2/privacy-controls
