name: Certify Dependabot Recovery

on:
  push:
    branches:
      - hotfix/dependabot-expo-compatibility
    paths:
      - .github/workflows/certify-dependabot-recovery.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: EAS OTA runtime contract
        run: node --import tsx --test tests/eas-ota-runtime-contract.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Generate native projects
        run: pnpm exec expo prebuild --clean --no-install
      - name: Deterministic prebuild and whitespace
        run: git diff --exit-code && git diff --check
      - name: Android bundle smoke test
        run: pnpm exec expo export --platform android --output-dir dist-recovery
      - name: Remove one-shot certification workflow
        run: |
          git rm .github/workflows/certify-dependabot-recovery.yml
          git config user.name "dropi-dependency-certification"
          git config user.email "dropi-dependency-certification@users.noreply.github.com"
          git commit -m "ci: complete dependency recovery certification"
          git push origin HEAD:hotfix/dependabot-expo-compatibility
