name: Register Romania cross-cutting current sources once

on:
  push:
    branches:
      - docs/ro-launch-007-legal-corpus

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ro-launch-007-legal-corpus
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Register current cross-cutting sources
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync, mkdirSync } = require('node:fs');
          const { dirname } = require('node:path');
          const { createHash } = require('node:crypto');

          const registerPath = 'docs/legal/legal-source-register.json';
          const register = JSON.parse(readFileSync(registerPath, 'utf8'));
          const byId = new Map(register.sources.map((s) => [s.id, s]));

          const specs = [
            {
              id: 'EU-DIR-2011-16-DAC-CONSOLIDATED-2026-01-01', jurisdiction: 'EU',
              serviceDomains: ['marketplace','tax','dac7'], authority: 'European Union',
              citation: 'Directive 2011/16/EU, consolidated 2026-01-01',
              title: 'Administrative cooperation in taxation — current consolidated DAC framework including DAC7',
              authorityClass: 'primary_normative', normative: true,
              officialUrl: 'https://eur-lex.europa.eu/eli/dir/2011/16/2026-01-01/eng', language: 'en', retrievedAt: '2026-09-16',
              archivePath: 'docs/legal/sources/eu/tax/EU-DIR-2011-16-DAC-CONSOLIDATED-2026-01-01.html',
              patterns: [/2011\/16\/EU/i, /Reporting Platform Operator/i, /Reportable Seller/i],
              reliance: { state: 'research_only', reviewBy: 'before_dac7_applicability_or_reporting_design', notes: 'Current consolidated DAC authority must supersede reliance on the original DAC7 amendment text alone. Platform/operator/seller facts and Romanian implementation remain separately gated.' }
            },
            {
              id: 'RO-OUG-71-2025-DAC7-CURRENT-AMENDMENTS', jurisdiction: 'RO',
              serviceDomains: ['marketplace','tax','dac7'], authority: 'Government of Romania',
              citation: 'Emergency Ordinance No. 71/2025',
              title: '2025 amendments to Romanian Tax Procedure Code including Article 291^5 DAC7 fields/register mechanics',
              authorityClass: 'primary_normative', normative: true,
              officialUrl: 'https://legislatie.just.ro/Public/DetaliiDocument/304846', language: 'ro', retrievedAt: '2026-09-16',
              archivePath: 'docs/legal/sources/ro/tax/RO-OUG-71-2025-DAC7-CURRENT-AMENDMENTS.html',
              patterns: [/71 din 5 decembrie 2025|71.*05\/12\/2025/is, /291\^5|2915/i],
              reliance: { state: 'pending_current_validation', reviewBy: 'before_dac7_applicability_or_reporting_design', notes: 'Article 291^5 was amended for reporting/identification mechanics from 2026. Must be reconciled with the current Code and forms before implementation reliance.' }
            },
            {
              id: 'RO-OG-1-2026-TAX-PROCEDURE-DAC-CURRENT', jurisdiction: 'RO',
              serviceDomains: ['marketplace','tax','dac7'], authority: 'Government of Romania',
              citation: 'Ordinance No. 1/2026',
              title: '2026 amendments to Romanian Tax Procedure Code and automatic exchange framework',
              authorityClass: 'primary_normative', normative: true,
              officialUrl: 'https://legislatie.just.ro/Public/DetaliiDocument/306795', language: 'ro', retrievedAt: '2026-09-16',
              archivePath: 'docs/legal/sources/ro/tax/RO-OG-1-2026-TAX-PROCEDURE-DAC-CURRENT.html',
              patterns: [/ORDONANȚĂ nr\. 1|ORDONANTA nr\. 1/i, /291\^5|2915/i],
              reliance: { state: 'pending_current_validation', reviewBy: 'before_dac7_applicability_or_reporting_design', notes: '2026 Tax Procedure Code amendment family affecting automatic-exchange architecture. Exact DAC7 effect must be reconciled against the current consolidated Code.' }
            },
            {
              id: 'EU-COM-PPWR-GUIDANCE-C-2026-3702', jurisdiction: 'EU',
              serviceDomains: ['marketplace','packaging','epr'], authority: 'European Commission',
              citation: 'Commission Notice C(2026) 3702 final',
              title: 'Commission guidance for Regulation (EU) 2025/40 on packaging and packaging waste',
              authorityClass: 'primary_official_guidance', normative: false,
              officialUrl: 'https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=intcom:C(2026)3702', language: 'en', retrievedAt: '2026-09-16',
              archivePath: 'docs/legal/sources/eu/packaging/EU-COM-PPWR-GUIDANCE-C-2026-3702.html',
              patterns: [/C\(2026\)\s*3702/i, /Regulation \(EU\) 2025\/40/i],
              reliance: { state: 'research_only', reviewBy: 'before_packaging_epr_marketplace_activation', notes: 'Official non-binding Commission guidance. Useful for PPWR/DSA online-platform interplay, but the Regulation and national implementation remain controlling.' }
            },
            {
              id: 'RO-OUG-196-2005-ENVIRONMENT-FUND-CURRENT-2026-09-16', jurisdiction: 'RO',
              serviceDomains: ['marketplace','packaging','epr','environment'], authority: 'Government of Romania',
              citation: 'Emergency Ordinance No. 196/2005, current Romanian Legislative Portal endpoint rechecked 2026-09-16',
              title: 'Environmental Fund framework including packaging-waste contribution categories',
              authorityClass: 'primary_normative', normative: true,
              officialUrl: 'https://legislatie.just.ro/Public/DetaliiDocument/67529', language: 'ro', retrievedAt: '2026-09-16',
              archivePath: 'docs/legal/sources/ro/environment/RO-OUG-196-2005-ENVIRONMENT-FUND-CURRENT-2026-09-16.html',
              patterns: [/196.*2005/is, /Fondul pentru mediu/i, /ambalaj/i],
              reliance: { state: 'pending_current_validation', reviewBy: 'before_packaging_epr_actor_approval', notes: 'Romanian environmental-fund/EPR contribution layer. Actor liability depends on actual placing-on-market/import/overpacking/sales-packaging facts and current amendments.' }
            },
            {
              id: 'RO-LAW-79-2026-ENVIRONMENT-FUND-AMENDMENT', jurisdiction: 'RO',
              serviceDomains: ['marketplace','packaging','epr','environment'], authority: 'Parliament of Romania',
              citation: 'Law No. 79/2026',
              title: '2026 approval of OUG 104/2024 amendments to Environmental Fund framework',
              authorityClass: 'primary_normative', normative: true,
              officialUrl: 'https://legislatie.just.ro/Public/DetaliiDocument/311011', language: 'ro', retrievedAt: '2026-09-16',
              archivePath: 'docs/legal/sources/ro/environment/RO-LAW-79-2026-ENVIRONMENT-FUND-AMENDMENT.html',
              patterns: [/LEGE nr\. 79|LEGEA nr\. 79/i, /196\/2005/i],
              reliance: { state: 'pending_current_validation', reviewBy: 'before_packaging_epr_actor_approval', notes: 'Current 2026 amendment-family evidence for the Romanian Environmental Fund framework; must be read together with the consolidated underlying instrument.' }
            },
            {
              id: 'EU-RECO-2003-361-SME-DEFINITION', jurisdiction: 'EU',
              serviceDomains: ['marketplace','p2b','accessibility','governance'], authority: 'European Commission',
              citation: 'Commission Recommendation 2003/361/EC',
              title: 'EU micro, small and medium-sized enterprise definition',
              authorityClass: 'primary_official_guidance', normative: false,
              officialUrl: 'https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32003H0361', language: 'en', retrievedAt: '2026-09-16',
              archivePath: 'docs/legal/sources/eu/governance/EU-RECO-2003-361-SME-DEFINITION.html',
              patterns: [/2003\/361/i, /small enterprise/i, /microenterprise/i],
              reliance: { state: 'research_only', reviewBy: 'when_p2b_or_accessibility_size_exception_is_assessed', notes: 'Referenced by P2B for small-enterprise exceptions. EAA has its own microenterprise definition with the same headline 10-person/2m thresholds; linked/partner enterprise treatment and the exact applicable legal instrument must be evidenced rather than replaced by Romanian fiscal microenterprise status.' }
            }
          ];

          async function capture(spec) {
            let source = byId.get(spec.id);
            if (!source) {
              source = {
                id: spec.id, jurisdiction: spec.jurisdiction, serviceDomains: spec.serviceDomains,
                authority: spec.authority, citation: spec.citation, title: spec.title,
                authorityClass: spec.authorityClass, normative: spec.normative,
                officialUrl: spec.officialUrl, language: spec.language, retrievedAt: spec.retrievedAt,
                snapshot: { status: 'pending_primary_copy', immutable: true, qualifier: 'Official endpoint verified; controlled repository copy remains pending if automated retrieval is unavailable.' },
                reliance: spec.reliance
              };
              register.sources.push(source);
              byId.set(spec.id, source);
            }
            try {
              const response = await fetch(spec.officialUrl, { redirect: 'follow', headers: { 'user-agent': 'DROPi-controlled-legal-corpus/1.0' } });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const bytes = Buffer.from(await response.arrayBuffer());
              const text = bytes.toString('utf8');
              for (const pattern of spec.patterns) if (!pattern.test(text)) throw new Error(`payload validation failed: ${pattern}`);
              mkdirSync(dirname(spec.archivePath), { recursive: true });
              writeFileSync(spec.archivePath, bytes);
              source.snapshot = {
                status: 'archived', path: spec.archivePath,
                sha256: createHash('sha256').update(bytes).digest('hex'), bytes: bytes.length,
                immutable: true,
                qualifier: 'Controlled byte snapshot fetched from the registered official URL on 2026-09-16. Archive proves reviewed bytes only; later amendments and DROPi factual applicability remain separately gated.'
              };
              console.log(`Archived ${spec.id}: ${bytes.length} bytes`);
            } catch (error) {
              console.log(`Pending ${spec.id}: ${error.message}`);
            }
          }

          (async () => {
            for (const spec of specs) await capture(spec);
            register.generatedAt = '2026-09-16T00:00:00Z';
            writeFileSync(registerPath, `${JSON.stringify(register, null, 2)}\n`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Validate legal source register
        run: node scripts/validate-legal-sources.mjs
      - name: Reject whitespace errors
        run: git diff --check
      - name: Commit controlled current source update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/legal/legal-source-register.json
          for d in docs/legal/sources/eu/tax docs/legal/sources/eu/packaging docs/legal/sources/eu/governance docs/legal/sources/ro/tax docs/legal/sources/ro/environment; do
            if [ -d "$d" ]; then git add "$d"; fi
          done
          git commit -m "docs(legal): register current cross-cutting authority updates"
          git push origin HEAD:docs/ro-launch-007-legal-corpus
