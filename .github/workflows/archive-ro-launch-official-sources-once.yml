name: Archive Romania launch official sources once

on:
  push:
    branches:
      - docs/ro-launch-007-legal-corpus
    paths:
      - scripts/archive-ro-launch-official-sources-2026-09-15.mjs
      - .github/workflows/archive-ro-launch-official-sources-once.yml

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ro-launch-007-legal-corpus
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Archive reachable registered official sources
        run: node scripts/archive-ro-launch-official-sources-2026-09-15.mjs

      - name: Validate controlled corpus
        run: node scripts/validate-legal-sources.mjs

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit controlled snapshots and register state
        run: |
          if git diff --quiet -- docs/legal/legal-source-register.json docs/legal/sources; then
            echo "No controlled source changes were produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/legal/legal-source-register.json docs/legal/sources
          git commit -m "docs(legal): archive reachable Romania launch official sources"
          git push origin HEAD:docs/ro-launch-007-legal-corpus
