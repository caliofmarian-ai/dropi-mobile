name: Validate Mail Transport

on:
  pull_request:
    branches:
      - main
    paths:
      - server/_core/mail.ts
      - tests/mail.resend.test.ts
      - tests/mail.password-recovery-template.test.ts
      - .env.example
      - .github/workflows/validate-mail-transport-pr.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resend transport and recovery-template tests
        run: pnpm exec vitest run tests/mail.resend.test.ts tests/mail.password-recovery-template.test.ts
      - name: Reject SMTP/Gmail fallback in canonical mail module
        run: |
          if grep -E 'nodemailer|SMTP_HOST|SMTP_PASS|GMAIL_APP_PASSWORD|smtp\.gmail\.com' server/_core/mail.ts; then
            echo "FAIL: canonical DROPi mail transport must remain Resend-only"
            exit 1
          fi
      - name: TypeScript
        run: pnpm check
      - name: Whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
