name: Validate Mail Transport

on:
  pull_request:
    branches:
      - main
    paths:
      - server/_core/mail.ts
      - tests/smtp.test.ts
      - tests/mail.resend.test.ts
      - .env.example
      - .github/workflows/validate-mail-transport-pr.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mail transport tests
        run: pnpm exec vitest run tests/smtp.test.ts tests/mail.resend.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
