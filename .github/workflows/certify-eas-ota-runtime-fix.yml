name: Certify EAS OTA Runtime Fix

on:
  push:
    branches:
      - ops/fix-eas-ota-runtime
    paths:
      - .github/workflows/certify-eas-ota-runtime-fix.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: EAS OTA runtime contract
        run: node --import tsx --test tests/eas-ota-runtime-contract.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Generate native projects exactly as OTA publication will
        run: pnpm exec expo prebuild --clean --no-install
      - name: Ensure prebuild does not mutate tracked source
        run: git diff --exit-code && git diff --check
      - name: Remove one-shot certification workflow
        run: |
          git rm .github/workflows/certify-eas-ota-runtime-fix.yml
          git config user.name "dropi-ota-certification"
          git config user.email "dropi-ota-certification@users.noreply.github.com"
          git commit -m "ci: complete EAS OTA runtime certification"
          git push origin HEAD:ops/fix-eas-ota-runtime
