name: Apply order management core

on:
  push:
    branches:
      - m1/order-management-core
    paths:
      - .github/workflows/apply-order-management-core.yml
      - scripts/apply_order_management_ui_patch.py

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1/order-management-core
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical order UI wiring
        run: python scripts/apply_order_management_ui_patch.py

      - name: Run order and regression certification
        run: >-
          pnpm exec vitest run
          tests/order-state-machine.test.ts
          tests/order-transition-notifications.test.ts
          tests/order-management-integration-contract.test.ts
          tests/push-state-notifications.test.ts
          tests/push-state-integration-contract.test.ts
          tests/live-tracking-security.test.ts
          tests/live-tracking-client-contract.test.ts
          tests/operational-safety-certification.test.ts

      - name: TypeScript check
        run: pnpm check

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit verified changes
        run: |
          rm .github/workflows/apply-order-management-core.yml
          rm scripts/apply_order_management_ui_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire canonical Marketplace order role flows"
          git push origin HEAD:m1/order-management-core
