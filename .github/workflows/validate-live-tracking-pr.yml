name: Validate live tracking security

on:
  pull_request:
    branches:
      - main
    paths:
      - server/live-tracking.ts
      - server/live-tracking-access.ts
      - server/operations-router.ts
      - hooks/use-live-tracking.ts
      - hooks/use-pilot-broadcasting.ts
      - app/pilot/live-tracking.tsx
      - app/pilot/broadcast.tsx
      - app/mission/[id].tsx
      - app/order/[id].tsx
      - app/(tabs)/index.tsx
      - tests/live-tracking-security.test.ts
      - tests/live-tracking-client-contract.test.ts
      - .github/workflows/validate-live-tracking-pr.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certification:
    name: M1 live-tracking security certification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run live-tracking security regressions
        run: pnpm exec vitest run tests/live-tracking-security.test.ts tests/live-tracking-client-contract.test.ts tests/operational-safety-certification.test.ts

      - name: TypeScript check
        run: pnpm check

      - name: Reject whitespace errors
        run: git diff --check origin/main...HEAD
