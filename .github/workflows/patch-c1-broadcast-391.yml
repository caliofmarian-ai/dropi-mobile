name: Patch C1 broadcast 391

on:
  push:
    branches:
      - fix/c1-pilot-broadcast-391
    paths:
      - scripts/patch-c1-broadcast-391.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/c1-pilot-broadcast-391
          fetch-depth: 0
      - name: Apply C1 broadcast patch
        run: python scripts/patch-c1-broadcast-391.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/c1-transactional-dashboards.tsx app/pilot/broadcast.tsx
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "C1-391: expose real Marketplace GPS broadcasting"
          git push origin HEAD:fix/c1-pilot-broadcast-391
