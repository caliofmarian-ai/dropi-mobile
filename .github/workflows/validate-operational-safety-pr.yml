name: Validate operational safety

on:
  pull_request:
    branches:
      - main
    paths:
      - server/auth-router.ts
      - server/b2b-router.ts
      - server/pilot-selection-router.ts
      - server/verification-router.ts
      - app/admin/approvals.tsx
      - app/(tabs)/index.tsx
      - tests/operational-safety-certification.test.ts
      - tests/TEST_REGISTRY.md
      - .github/workflows/validate-operational-safety-pr.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certification:
    name: Sprint 6A operational safety certification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run operational safety certification
        run: pnpm exec vitest run tests/operational-safety-certification.test.ts

      - name: Reject whitespace errors
        run: git diff --check origin/main...HEAD
