name: Register Romania privacy DPIA sources once

on:
  push:
    branches:
      - docs/ro-launch-007-legal-corpus
    paths:
      - .github/workflows/register-ro-privacy-dpia-sources-once.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ro-launch-007-legal-corpus
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Register and archive official privacy DPIA sources when reachable
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync, mkdirSync } = require('node:fs');
          const { dirname } = require('node:path');
          const { createHash } = require('node:crypto');

          const registerPath = 'docs/legal/legal-source-register.json';
          const register = JSON.parse(readFileSync(registerPath, 'utf8'));
          const byId = new Map(register.sources.map((s) => [s.id, s]));

          const specs = [
            {
              id: 'RO-ANSPDCP-DECISION-174-2018-DPIA',
              jurisdiction: 'RO',
              serviceDomains: ['all', 'marketplace', 'parcel_delivery', 'privacy'],
              authority: 'Romanian National Supervisory Authority for Personal Data Processing',
              citation: 'ANSPDCP Decision No. 174/2018',
              title: 'List of processing operations requiring a data protection impact assessment',
              authorityClass: 'primary_normative',
              normative: true,
              officialUrl: 'https://legislatie.just.ro/public/detaliidocument/206331',
              language: 'ro',
              retrievedAt: '2026-09-15',
              archivePath: 'docs/legal/sources/ro/data-protection/RO-ANSPDCP-DECISION-174-2018-DPIA-2026-09-15.html',
              expected: [/DECIZIE\s+(?:nr\.\s*)?174/i, /evalu[aă]rii impactului/i],
              pendingQualifier: 'Official Legislative Portal endpoint verified; controlled repository bytes/hash remain pending if automated retrieval is unavailable.',
              reliance: {
                state: 'pending_current_validation',
                reviewBy: 'before_ro_dpia_decision_or_high_risk_processing',
                notes: 'National DPIA list must be evaluated together with GDPR Article 35 against each factual processing activity; the list is not a universal DROPi-wide DPIA conclusion.'
              }
            },
            {
              id: 'RO-ANSPDCP-DPIA-GUIDANCE-2026-09-15',
              jurisdiction: 'RO',
              serviceDomains: ['all', 'marketplace', 'parcel_delivery', 'privacy'],
              authority: 'Romanian National Supervisory Authority for Personal Data Processing',
              citation: 'ANSPDCP DPIA guidance page rechecked 2026-09-15',
              title: 'Final DPIA guidance',
              authorityClass: 'primary_official_guidance',
              normative: false,
              officialUrl: 'https://www.dataprotection.ro/?lang=ro&page=Comunicat_ghid_final_DPIA',
              language: 'ro',
              retrievedAt: '2026-09-15',
              archivePath: 'docs/legal/sources/ro/data-protection/RO-ANSPDCP-DPIA-GUIDANCE-2026-09-15.html',
              expected: [/DPIA/i, /Evaluarea de impact|evalu[aă]rii impactului/i],
              pendingQualifier: 'Official ANSPDCP guidance endpoint verified; controlled repository snapshot remains pending if automated retrieval is unavailable.',
              reliance: {
                state: 'research_only',
                reviewBy: 'before_ro_dpia_decision_or_high_risk_processing',
                notes: 'Guidance supports risk-based DPIA assessment and does not substitute for GDPR, Decision 174/2018, or a documented DROPi DPIA decision.'
              }
            }
          ];

          async function capture(spec) {
            let source = byId.get(spec.id);
            if (!source) {
              source = {
                id: spec.id,
                jurisdiction: spec.jurisdiction,
                serviceDomains: spec.serviceDomains,
                authority: spec.authority,
                citation: spec.citation,
                title: spec.title,
                authorityClass: spec.authorityClass,
                normative: spec.normative,
                officialUrl: spec.officialUrl,
                language: spec.language,
                retrievedAt: spec.retrievedAt,
                snapshot: {
                  status: 'pending_primary_copy',
                  immutable: true,
                  qualifier: spec.pendingQualifier
                },
                reliance: spec.reliance
              };
              register.sources.push(source);
              byId.set(spec.id, source);
            }

            try {
              const response = await fetch(spec.officialUrl, {
                redirect: 'follow',
                headers: { 'user-agent': 'DROPi-controlled-legal-corpus/1.0' }
              });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const bytes = Buffer.from(await response.arrayBuffer());
              const text = bytes.toString('utf8');
              for (const pattern of spec.expected) {
                if (!pattern.test(text)) throw new Error(`payload validation failed: ${pattern}`);
              }
              mkdirSync(dirname(spec.archivePath), { recursive: true });
              writeFileSync(spec.archivePath, bytes);
              source.snapshot = {
                status: 'archived',
                path: spec.archivePath,
                sha256: createHash('sha256').update(bytes).digest('hex'),
                bytes: bytes.length,
                immutable: true,
                qualifier: 'Controlled byte snapshot fetched from the registered official URL on 2026-09-15. Archive proves reviewed bytes only; amendments, applicability and DROPi DPIA conclusions remain separately gated.'
              };
              console.log(`Archived ${spec.id}: ${bytes.length} bytes`);
            } catch (error) {
              console.log(`Pending ${spec.id}: ${error.message}`);
            }
          }

          (async () => {
            for (const spec of specs) await capture(spec);
            register.generatedAt = '2026-09-15T00:00:00Z';
            writeFileSync(registerPath, `${JSON.stringify(register, null, 2)}\n`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Validate legal source register
        run: node scripts/validate-legal-sources.mjs

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit controlled privacy source update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/legal/legal-source-register.json
          if [ -d docs/legal/sources/ro/data-protection ]; then
            git add docs/legal/sources/ro/data-protection
          fi
          git commit -m "docs(privacy): register Romania DPIA source family"
          git push origin HEAD:docs/ro-launch-007-legal-corpus
