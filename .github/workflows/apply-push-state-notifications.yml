name: Apply push state notifications

on:
  push:
    branches:
      - m1/push-state-notifications
    paths:
      - .github/workflows/apply-push-state-notifications.yml
      - scripts/apply_push_state_notifications.py

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1/push-state-notifications
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply transition push wiring
        run: python scripts/apply_push_state_notifications.py

      - name: Run notification and safety regressions
        run: pnpm exec vitest run tests/push-state-notifications.test.ts tests/push-state-integration-contract.test.ts tests/live-tracking-security.test.ts tests/live-tracking-client-contract.test.ts tests/operational-safety-certification.test.ts

      - name: TypeScript check
        run: pnpm check

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit verified changes
        run: |
          rm .github/workflows/apply-push-state-notifications.yml
          rm scripts/apply_push_state_notifications.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire preference-aware B2B state push notifications"
          git push origin HEAD:m1/push-state-notifications
