name: Apply operational safety hardening

on:
  push:
    branches:
      - m1/certify-operational-safety
    paths:
      - .github/workflows/apply-operational-safety-patch.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout safety branch
        uses: actions/checkout@v4
        with:
          ref: m1/certify-operational-safety
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply minimal mission authorization hardening
        shell: python
        run: |
          from pathlib import Path

          b2b = Path("server/b2b-router.ts")
          text = b2b.read_text(encoding="utf-8")
          old = '''    .mutation(async ({ ctx, input }) => {
                const db = await getDb();
                if (!db) throw new Error("Database unavailable");

                const user = ctx.user as any;
                if (!user) throw new Error("Authentication required");

                // Sprint 6A Guard: Block unverified delivery partners from mission operations
                if (!user.isVerified) {
                  throw new Error("Your account is not yet verified. Please submit your documents and wait for admin approval before accepting missions.");
                }
                if (!user.isActive) {
                  throw new Error("Your account is inactive. Please contact support.");
                }
          '''
          new = '''    .mutation(async ({ ctx, input }) => {
                const user = ctx.user as any;
                if (!user) throw new Error("Authentication required");
                if (user.dropiRole !== "delivery_partner") {
                  throw new Error("Only delivery partners can update delivery mission status.");
                }

                // Sprint 6A Guard: Block unverified/inactive delivery partners before DB access.
                if (!user.isVerified) {
                  throw new Error("Your account is not yet verified. Please submit your documents and wait for admin approval before accepting missions.");
                }
                if (!user.isActive) {
                  throw new Error("Your account is inactive. Please contact support.");
                }

                const db = await getDb();
                if (!db) throw new Error("Database unavailable");
          '''
          if old not in text:
              raise SystemExit("b2b guard block not found exactly once")
          text = text.replace(old, new, 1)

          old = '''      if (delivery.length === 0) throw new Error("Delivery not found");

                // Validate forward-only transitions
          '''
          new = '''      if (delivery.length === 0) throw new Error("Delivery not found");

                // A delivery already assigned to a pilot can only be mutated by that pilot.
                if (delivery[0].assignedPilotId && delivery[0].assignedPilotId !== user.id) {
                  throw new Error("This delivery is assigned to another pilot.");
                }

                // Validate forward-only transitions
          '''
          if old not in text:
              raise SystemExit("b2b ownership insertion point not found exactly once")
          text = text.replace(old, new, 1)
          b2b.write_text(text, encoding="utf-8")

          pilot = Path("server/pilot-selection-router.ts")
          text = pilot.read_text(encoding="utf-8")
          old = '''      const userId = (ctx.user as any)?.id;
                if (!userId) return { success: false };

                // Sprint 6A Guard: Block unverified pilots
                const user = ctx.user as any;
                if (!user.isVerified) {
                  throw new Error("Your account is not yet verified. Submit documents and wait for approval before going online.");
                }
          '''
          new = '''      const userId = (ctx.user as any)?.id;
                if (!userId) return { success: false };

                const user = ctx.user as any;
                if (user.dropiRole !== "delivery_partner") {
                  throw new Error("Only delivery partners can update pilot availability.");
                }
                // Sprint 6A Guard: Block unverified/inactive pilots before profile mutation.
                if (!user.isVerified) {
                  throw new Error("Your account is not yet verified. Submit documents and wait for approval before going online.");
                }
                if (!user.isActive) {
                  throw new Error("Your account is inactive. Please contact support.");
                }
          '''
          if old not in text:
              raise SystemExit("pilot availability guard block not found exactly once")
          text = text.replace(old, new, 1)

          old = '''      const userId = (ctx.user as any)?.id;
                if (!userId) return { success: false };

                // Sprint 6A Guard: Block unverified pilots
                const user = ctx.user as any;
                if (!user.isVerified) {
                  throw new Error("Account not verified. Cannot update position.");
                }

                const db = await getDb();
          '''
          new = '''      const userId = (ctx.user as any)?.id;
                if (!userId) return { success: false };

                const user = ctx.user as any;
                if (user.dropiRole !== "delivery_partner") {
                  throw new Error("Only delivery partners can update pilot position.");
                }
                // Sprint 6A Guard: Block unverified/inactive pilots before DB access.
                if (!user.isVerified) {
                  throw new Error("Account not verified. Cannot update position.");
                }
                if (!user.isActive) {
                  throw new Error("Your account is inactive. Please contact support.");
                }

                const db = await getDb();
          '''
          if old not in text:
              raise SystemExit("pilot position guard block not found exactly once")
          text = text.replace(old, new, 1)
          pilot.write_text(text, encoding="utf-8")

      - name: Run Sprint 6A certification tests
        run: pnpm exec vitest run tests/operational-safety-certification.test.ts

      - name: Commit hardened code and remove one-time workflow
        run: |
          rm .github/workflows/apply-operational-safety-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/b2b-router.ts server/pilot-selection-router.ts .github/workflows/apply-operational-safety-patch.yml
          git commit -m "fix: harden delivery-partner mission authorization"
          git push origin HEAD:m1/certify-operational-safety
