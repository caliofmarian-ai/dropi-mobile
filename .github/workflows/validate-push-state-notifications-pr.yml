name: Validate state push notifications

on:
  pull_request:
    branches:
      - main
    paths:
      - server/preference-aware-push.ts
      - server/b2b-transition-notifications.ts
      - server/b2b-router.ts
      - server/rest-gateway.ts
      - server/push-notifications.ts
      - server/notification-router.ts
      - tests/push-state-notifications.test.ts
      - tests/push-state-integration-contract.test.ts
      - .github/workflows/validate-push-state-notifications-pr.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certification:
    name: M1 state push notification certification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run push notification regressions
        run: pnpm exec vitest run tests/push-state-notifications.test.ts tests/push-state-integration-contract.test.ts tests/live-tracking-security.test.ts tests/live-tracking-client-contract.test.ts tests/operational-safety-certification.test.ts

      - name: TypeScript check
        run: pnpm check

      - name: Reject whitespace errors
        run: git diff --check origin/main...HEAD
