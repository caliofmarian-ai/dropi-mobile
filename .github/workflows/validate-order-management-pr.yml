name: Validate canonical order management

on:
  pull_request:
    branches:
      - main
    paths:
      - server/order-state-machine.ts
      - server/order-management-service.ts
      - server/order-transition-notifications.ts
      - server/operations-router.ts
      - app/merchant-order/[id].tsx
      - app/order/[id].tsx
      - app/(tabs)/index.tsx
      - tests/order-state-machine.test.ts
      - tests/order-transition-notifications.test.ts
      - tests/order-management-integration-contract.test.ts
      - .github/workflows/validate-order-management-pr.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certification:
    name: M1 canonical order management certification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run order and regression certification
        run: >-
          pnpm exec vitest run
          tests/order-state-machine.test.ts
          tests/order-transition-notifications.test.ts
          tests/order-management-integration-contract.test.ts
          tests/push-state-notifications.test.ts
          tests/push-state-integration-contract.test.ts
          tests/live-tracking-security.test.ts
          tests/live-tracking-client-contract.test.ts
          tests/operational-safety-certification.test.ts

      - name: TypeScript check
        run: pnpm check

      - name: Reject whitespace errors
        run: git diff --check origin/main...HEAD
