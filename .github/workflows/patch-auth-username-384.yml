name: Patch AUTH 384

on:
  push:
    branches:
      - fix/auth-username-login-384
    paths:
      - .github/workflows/patch-auth-username-384.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/auth-username-login-384
          fetch-depth: 0
      - name: Apply AUTH-384 repository changes
        run: python scripts/patch-auth-username-384.py
      - name: Commit implementation
        run: |
          git restore .github/workflows/validate-security-assurance-pr.yml
          git config user.name "DROPi Automation"
          git config user.email "dropi.deliveries@gmail.com"
          git add drizzle shared server lib app tests
          git commit -m "AUTH-384: support email or username login"
          git push origin HEAD:fix/auth-username-login-384
