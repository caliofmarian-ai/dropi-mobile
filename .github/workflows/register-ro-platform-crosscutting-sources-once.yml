name: Register Romania platform cross-cutting sources once

on:
  push:
    branches:
      - docs/ro-launch-007-legal-corpus

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ro-launch-007-legal-corpus
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Register and archive P2B DAC7 accessibility and packaging sources when reachable
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync, mkdirSync } = require('node:fs');
          const { dirname } = require('node:path');
          const { createHash } = require('node:crypto');

          const registerPath = 'docs/legal/legal-source-register.json';
          const register = JSON.parse(readFileSync(registerPath, 'utf8'));
          const byId = new Map(register.sources.map((s) => [s.id, s]));

          const specs = [
            {
              id:'EU-REG-2019-1150-P2B', jurisdiction:'EU', serviceDomains:['marketplace','business_users'],
              authority:'European Union', citation:'Regulation (EU) 2019/1150',
              title:'Fairness and transparency for business users of online intermediation services', authorityClass:'primary_normative', normative:true,
              officialUrl:'https://eur-lex.europa.eu/eli/reg/2019/1150/oj', language:'en', retrievedAt:'2026-09-16',
              archivePath:'docs/legal/sources/eu/platform-business/EU-REG-2019-1150-P2B.html', pdf:false,
              patterns:[/2019\/1150/i,/business users of online intermediation services/i],
              reliance:{state:'pending_current_validation',reviewBy:'before_ro_merchant_terms_design',notes:'Potentially applies to the DROPi professional-merchant Marketplace relationship. Exact service scope, business-user facts and small-enterprise exceptions must be evidenced before law-dependent merchant terms are approved.'}
            },
            {
              id:'RO-OUG-23-2021-P2B-ENFORCEMENT', jurisdiction:'RO', serviceDomains:['marketplace','business_users'],
              authority:'Government of Romania', citation:'Emergency Ordinance No. 23/2021',
              title:'Romanian enforcement measures for Regulation (EU) 2019/1150', authorityClass:'primary_normative', normative:true,
              officialUrl:'https://legislatie.just.ro/Public/DetaliiDocument/240385', language:'ro', retrievedAt:'2026-09-16',
              archivePath:'docs/legal/sources/ro/platform-business/RO-OUG-23-2021-P2B-ENFORCEMENT.html', pdf:false,
              patterns:[/23\/2021|nr\. 23/i,/2019\/1150/i],
              reliance:{state:'pending_current_validation',reviewBy:'before_ro_merchant_terms_design',notes:'Romanian P2B enforcement baseline; current consolidated amendments and exact DROPi applicability require review. Consiliul Concurentei enforcement evidence must be reconciled before public operation.'}
            },
            {
              id:'EU-DIR-2021-514-DAC7', jurisdiction:'EU', serviceDomains:['marketplace','tax_reporting'],
              authority:'European Union', citation:'Council Directive (EU) 2021/514',
              title:'DAC7 platform reporting amendments to Directive 2011/16/EU', authorityClass:'primary_normative', normative:true,
              officialUrl:'https://eur-lex.europa.eu/eli/dir/2021/514/oj', language:'en', retrievedAt:'2026-09-16',
              archivePath:'docs/legal/sources/eu/tax-reporting/EU-DIR-2021-514-DAC7.html', pdf:false,
              patterns:[/2021\/514/i,/platform operators|reporting platform operator/i],
              reliance:{state:'research_only',reviewBy:'before_ro_dac7_design',notes:'EU DAC7 baseline. Romanian implementation and the exact DROPi reporting-platform-operator / relevant-activity / reportable-seller analysis control production obligations.'}
            },
            {
              id:'RO-OG-16-2023-DAC7', jurisdiction:'RO', serviceDomains:['marketplace','tax_reporting'],
              authority:'Government of Romania', citation:'Government Ordinance No. 16/2023',
              title:'Romanian DAC7 implementation in the Tax Procedure Code', authorityClass:'primary_normative', normative:true,
              officialUrl:'https://legislatie.just.ro/Public/DetaliiDocument/264508', language:'ro', retrievedAt:'2026-09-16',
              archivePath:'docs/legal/sources/ro/tax-reporting/RO-OG-16-2023-DAC7.html', pdf:false,
              patterns:[/ORDONANȚĂ.*16|ORDONANTA.*16/is,/Operatorii de platforme/i,/2021\/514/i],
              reliance:{state:'pending_current_validation',reviewBy:'before_ro_dac7_design',notes:'Romanian DAC7 diligence/reporting baseline. Does not establish that DROPi is a reporting platform operator without the factual applicability analysis.'}
            },
            {
              id:'RO-ANAF-DAC7-GUIDE-2024', jurisdiction:'RO', serviceDomains:['marketplace','tax_reporting'],
              authority:'Romanian National Agency for Fiscal Administration', citation:'ANAF DAC7 Guide 2024',
              title:'Guide for DAC7 platform due diligence and reporting', authorityClass:'primary_official_guidance', normative:false,
              officialUrl:'https://static.anaf.ro/static/10/Anaf/AsistentaContribuabili_r/AEOI/GhidDAC7.pdf', language:'ro', retrievedAt:'2026-09-16',
              archivePath:'docs/legal/sources/ro/tax-reporting/RO-ANAF-DAC7-GUIDE-2024.pdf', pdf:true,
              reliance:{state:'research_only',reviewBy:'before_ro_dac7_design',notes:'Official ANAF guidance. Useful for platform/operator/relevant-activity concepts and process preparation; does not replace the Tax Procedure Code, OG 16/2023 or current ANAF orders.'}
            },
            {
              id:'RO-ANAF-ORDER-1996-2023-DAC7-F7000', jurisdiction:'RO', serviceDomains:['marketplace','tax_reporting'],
              authority:'Romanian National Agency for Fiscal Administration', citation:'ANAF Order No. 1996/2023',
              title:'DAC7 F7000 reporting form and instructions', authorityClass:'primary_normative', normative:true,
              officialUrl:'https://legislatie.just.ro/Public/DetaliiDocument/277645', language:'ro', retrievedAt:'2026-09-16',
              archivePath:'docs/legal/sources/ro/tax-reporting/RO-ANAF-ORDER-1996-2023-DAC7-F7000.html', pdf:false,
              patterns:[/ORDIN.*1\.996|ORDIN.*1996/is,/F7000/i,/Vânzător Raportabil|Vanzator Raportabil/i],
              reliance:{state:'pending_current_validation',reviewBy:'before_ro_dac7_reporting_activation',notes:'F7000 schema evidence if DROPi is a Romanian reporting platform operator. Current form/version must be rechecked before filing.'}
            },
            {
              id:'RO-ANAF-ORDER-1946-2023-DAC7-707', jurisdiction:'RO', serviceDomains:['marketplace','tax_reporting'],
              authority:'Romanian National Agency for Fiscal Administration', citation:'ANAF Order No. 1946/2023',
              title:'DAC7 registration/mentions procedures and Form 707', authorityClass:'primary_normative', normative:true,
              officialUrl:'https://legislatie.just.ro/Public/DetaliiDocument/277014', language:'ro', retrievedAt:'2026-09-16',
              archivePath:'docs/legal/sources/ro/tax-reporting/RO-ANAF-ORDER-1946-2023-DAC7-707.html', pdf:false,
              patterns:[/ORDIN.*1\.946|ORDIN.*1946/is,/707/i,/operatorii de platformă|operatorii de platforma/i],
              reliance:{state:'pending_current_validation',reviewBy:'before_ro_dac7_registration',notes:'Romanian DAC7 registration/mentions procedure baseline. Applicability depends on operator classification and jurisdiction facts.'}
            },
            {
              id:'RO-ANAF-ORDER-1226-2023-DAC7-CONTROLS', jurisdiction:'RO', serviceDomains:['marketplace','tax_reporting'],
              authority:'Romanian National Agency for Fiscal Administration', citation:'ANAF Order No. 1226/2023',
              title:'DAC7 due-diligence and reporting verification procedures', authorityClass:'primary_normative', normative:true,
              officialUrl:'https://legislatie.just.ro/Public/DetaliiDocument/273737', language:'ro', retrievedAt:'2026-09-16',
              archivePath:'docs/legal/sources/ro/tax-reporting/RO-ANAF-ORDER-1226-2023-DAC7-CONTROLS.html', pdf:false,
              patterns:[/ORDIN.*1\.226|ORDIN.*1226/is,/diligență fiscală|diligenta fiscala/i,/operatorii de platforme/i],
              reliance:{state:'pending_current_validation',reviewBy:'before_ro_dac7_design',notes:'Shows ANAF verification of platform due diligence/reporting; reinforces the need for evidence-backed seller classification/data collection if DAC7 applies.'}
            },
            {
              id:'RO-LAW-232-2022-ACCESSIBILITY', jurisdiction:'RO', serviceDomains:['marketplace','accessibility'],
              authority:'Parliament of Romania', citation:'Law No. 232/2022',
              title:'Accessibility requirements for products and services including e-commerce services', authorityClass:'primary_normative', normative:true,
              officialUrl:'https://legislatie.just.ro/Public/DetaliiDocument/257778', language:'ro', retrievedAt:'2026-09-16',
              archivePath:'docs/legal/sources/ro/accessibility/RO-LAW-232-2022-ACCESSIBILITY.html', pdf:false,
              patterns:[/LEGE.*232/is,/servicii de comerț electronic|servicii de comert electronic/i,/microîntreprinder|microintreprinder/i],
              reliance:{state:'pending_current_validation',reviewBy:'before_ro_storefront_checkout_design',notes:'Applies from 28 June 2025 to covered e-commerce services; microenterprise service exemption and actual DROPi enterprise status must be evidenced rather than assumed.'}
            },
            {
              id:'EU-DIR-2019-882-EAA', jurisdiction:'EU', serviceDomains:['marketplace','accessibility'],
              authority:'European Union', citation:'Directive (EU) 2019/882',
              title:'European Accessibility Act', authorityClass:'primary_normative', normative:true,
              officialUrl:'https://eur-lex.europa.eu/eli/dir/2019/882/oj', language:'en', retrievedAt:'2026-09-16',
              archivePath:'docs/legal/sources/eu/accessibility/EU-DIR-2019-882-EAA.html', pdf:false,
              patterns:[/2019\/882/i,/e-commerce services/i],
              reliance:{state:'research_only',reviewBy:'before_ro_accessibility_approval',notes:'EU accessibility baseline; Romanian Law 232/2022 controls national application, including microenterprise service exemptions.'}
            },
            {
              id:'EU-REG-2025-40-PPWR', jurisdiction:'EU', serviceDomains:['marketplace','packaging','fulfilment'],
              authority:'European Union', citation:'Regulation (EU) 2025/40',
              title:'Packaging and packaging waste regulation (PPWR)', authorityClass:'primary_normative', normative:true,
              officialUrl:'https://eur-lex.europa.eu/eli/reg/2025/40/oj', language:'en', retrievedAt:'2026-09-16',
              archivePath:'docs/legal/sources/eu/packaging/EU-REG-2025-40-PPWR.html', pdf:false,
              patterns:[/2025\/40/i,/apply from 12 August 2026/i],
              reliance:{state:'pending_current_validation',reviewBy:'before_ro_packaging_fulfilment_design',notes:'Directly applicable from 12 August 2026. Exact producer/economic-operator/platform/fulfilment roles and first-pilot packaging obligations require provision-to-flow review.'}
            },
            {
              id:'RO-LAW-249-2015-PACKAGING-CURRENT', jurisdiction:'RO', serviceDomains:['marketplace','packaging','fulfilment'],
              authority:'Parliament of Romania', citation:'Law No. 249/2015',
              title:'Packaging and packaging waste management', authorityClass:'primary_normative', normative:true,
              officialUrl:'https://legislatie.just.ro/Public/DetaliiDocumentAfis/202801', language:'ro', retrievedAt:'2026-09-16',
              archivePath:'docs/legal/sources/ro/packaging/RO-LAW-249-2015-PACKAGING-CURRENT.html', pdf:false,
              patterns:[/LEGE.*249/is,/ambalajelor/i,/deșeurilor de ambalaje|deseurilor de ambalaje/i],
              reliance:{state:'pending_current_validation',reviewBy:'before_ro_packaging_fulfilment_design',notes:'Romanian packaging baseline; must be reconciled with PPWR and current environmental/EPR implementing rules before seller or DROPi obligations are hard-coded.'}
            }
          ];

          async function capture(spec) {
            let source = byId.get(spec.id);
            if (!source) {
              source = {
                id: spec.id, jurisdiction: spec.jurisdiction, serviceDomains: spec.serviceDomains,
                authority: spec.authority, citation: spec.citation, title: spec.title,
                authorityClass: spec.authorityClass, normative: spec.normative,
                officialUrl: spec.officialUrl, language: spec.language, retrievedAt: spec.retrievedAt,
                snapshot: { status:'pending_primary_copy', immutable:true, qualifier:'Official endpoint verified; controlled repository copy remains pending if automated retrieval is unavailable.' },
                reliance: spec.reliance
              };
              register.sources.push(source);
              byId.set(spec.id, source);
            }
            try {
              const response = await fetch(spec.officialUrl, { redirect:'follow', headers:{'user-agent':'DROPi-controlled-legal-corpus/1.0'} });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const bytes = Buffer.from(await response.arrayBuffer());
              if (spec.pdf) {
                if (bytes.subarray(0,5).toString('ascii') !== '%PDF-') throw new Error('payload is not PDF');
              } else {
                const text = bytes.toString('utf8');
                for (const pattern of spec.patterns) if (!pattern.test(text)) throw new Error(`payload validation failed: ${pattern}`);
              }
              mkdirSync(dirname(spec.archivePath), { recursive:true });
              writeFileSync(spec.archivePath, bytes);
              source.snapshot = {
                status:'archived', path:spec.archivePath,
                sha256:createHash('sha256').update(bytes).digest('hex'), bytes:bytes.length,
                immutable:true,
                qualifier:'Controlled byte snapshot fetched from the registered official URL on 2026-09-16. Archive proves reviewed bytes only; amendments, effective dates, factual roles and DROPi applicability remain separately gated.'
              };
              console.log(`Archived ${spec.id}: ${bytes.length} bytes`);
            } catch (error) {
              console.log(`Pending ${spec.id}: ${error.message}`);
            }
          }

          (async()=>{
            for (const spec of specs) await capture(spec);
            register.generatedAt='2026-09-16T00:00:00Z';
            writeFileSync(registerPath, `${JSON.stringify(register,null,2)}\n`);
          })().catch((error)=>{console.error(error);process.exit(1)});
          NODE
      - name: Validate legal source register
        run: node scripts/validate-legal-sources.mjs
      - name: Reject whitespace errors
        run: git diff --check
      - name: Commit controlled cross-cutting source update
        shell: bash
        run: |
          if git diff --quiet; then echo "No source changes required"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/legal/legal-source-register.json
          for d in docs/legal/sources/eu/platform-business docs/legal/sources/ro/platform-business docs/legal/sources/eu/tax-reporting docs/legal/sources/ro/tax-reporting docs/legal/sources/eu/accessibility docs/legal/sources/ro/accessibility docs/legal/sources/eu/packaging docs/legal/sources/ro/packaging; do
            if [ -d "$d" ]; then git add "$d"; fi
          done
          git commit -m "docs(legal): register platform cross-cutting source family"
          git push origin HEAD:docs/ro-launch-007-legal-corpus
