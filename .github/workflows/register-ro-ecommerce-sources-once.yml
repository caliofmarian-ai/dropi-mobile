name: Register Romania e-commerce sources once

on:
  push:
    branches:
      - docs/ro-launch-007-legal-corpus
    paths:
      - .github/workflows/register-ro-ecommerce-sources-once.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ro-launch-007-legal-corpus
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Register and archive official e-commerce sources when reachable
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync, mkdirSync } = require('node:fs');
          const { dirname } = require('node:path');
          const { createHash } = require('node:crypto');

          const registerPath = 'docs/legal/legal-source-register.json';
          const register = JSON.parse(readFileSync(registerPath, 'utf8'));
          const byId = new Map(register.sources.map((s) => [s.id, s]));

          const specs = [
            {
              id: 'RO-LAW-365-2002-CURRENT',
              jurisdiction: 'RO',
              serviceDomains: ['marketplace', 'intermediary_services', 'electronic_commerce'],
              authority: 'Parliament of Romania',
              citation: 'Law No. 365/2002 — republicated Electronic Commerce Law',
              title: 'Electronic commerce',
              authorityClass: 'primary_normative',
              normative: true,
              officialUrl: 'https://legislatie.just.ro/Public/DetaliiDocument/37075',
              language: 'ro',
              retrievedAt: '2026-09-15',
              archivePath: 'docs/legal/sources/ro/ecommerce/RO-LAW-365-2002-REPUBLICATED-2026-09-15.html',
              expected: [/LEGE\s+(?:nr\.\s*)?365/i, /comer(?:ț|ţ)t?ul\s+electronic/i],
              pendingQualifier: 'Official Legislative Portal endpoint for the republicated act is verified; controlled repository bytes/hash remain pending if automated retrieval is unavailable.',
              reliance: {
                state: 'pending_current_validation',
                reviewBy: 'before_ro_marketplace_or_intermediary_service_design',
                notes: 'Electronic-commerce / information-society-service baseline. Reconcile with DSA, Law 50/2024, OUG 34/2014 and later amendments; no direct launch permission.'
              }
            },
            {
              id: 'RO-HG-1308-2002-E_COMMERCE-NORMS',
              jurisdiction: 'RO',
              serviceDomains: ['marketplace', 'intermediary_services', 'electronic_commerce', 'payments'],
              authority: 'Government of Romania',
              citation: 'Government Decision No. 1308/2002',
              title: 'Methodological norms for application of Law No. 365/2002',
              authorityClass: 'primary_normative',
              normative: true,
              officialUrl: 'https://legislatie.just.ro/Public/DetaliiDocument/40350',
              language: 'ro',
              retrievedAt: '2026-09-15',
              archivePath: 'docs/legal/sources/ro/ecommerce/RO-HG-1308-2002-E-COMMERCE-NORMS-2026-09-15.html',
              expected: [/(?:HOTĂRÂRE|HOTARARE)\s+(?:nr\.\s*)?1\.308/i, /365\/2002/i],
              pendingQualifier: 'Official Legislative Portal endpoint is verified; controlled repository bytes/hash remain pending if automated retrieval is unavailable.',
              reliance: {
                state: 'pending_current_validation',
                reviewBy: 'before_ro_marketplace_or_intermediary_service_design',
                notes: 'Methodological norms are historical and contain payment references that require reconciliation with the current payment-services and DSA framework; never hardcode superseded payment rules.'
              }
            }
          ];

          async function capture(spec) {
            let source = byId.get(spec.id);
            if (!source) {
              source = {
                id: spec.id,
                jurisdiction: spec.jurisdiction,
                serviceDomains: spec.serviceDomains,
                authority: spec.authority,
                citation: spec.citation,
                title: spec.title,
                authorityClass: spec.authorityClass,
                normative: spec.normative,
                officialUrl: spec.officialUrl,
                language: spec.language,
                retrievedAt: spec.retrievedAt,
                snapshot: {
                  status: 'pending_primary_copy',
                  immutable: true,
                  qualifier: spec.pendingQualifier
                },
                reliance: spec.reliance
              };
              register.sources.push(source);
              byId.set(spec.id, source);
            }

            try {
              const response = await fetch(spec.officialUrl, {
                redirect: 'follow',
                headers: { 'user-agent': 'DROPi-controlled-legal-corpus/1.0' }
              });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const bytes = Buffer.from(await response.arrayBuffer());
              const text = bytes.toString('utf8');
              for (const pattern of spec.expected) {
                if (!pattern.test(text)) throw new Error(`payload validation failed: ${pattern}`);
              }
              mkdirSync(dirname(spec.archivePath), { recursive: true });
              writeFileSync(spec.archivePath, bytes);
              source.snapshot = {
                status: 'archived',
                path: spec.archivePath,
                sha256: createHash('sha256').update(bytes).digest('hex'),
                bytes: bytes.length,
                immutable: true,
                qualifier: 'Controlled byte snapshot fetched from the registered official Legislative Portal URL on 2026-09-15. Archive proves reviewed bytes only; current applicability, amendments and interpretation remain separately gated.'
              };
              console.log(`Archived ${spec.id}: ${bytes.length} bytes`);
            } catch (error) {
              console.log(`Pending ${spec.id}: ${error.message}`);
            }
          }

          (async () => {
            for (const spec of specs) await capture(spec);
            register.generatedAt = '2026-09-15T00:00:00Z';
            writeFileSync(registerPath, `${JSON.stringify(register, null, 2)}\n`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Validate legal source register
        run: node scripts/validate-legal-sources.mjs

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit controlled source update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/legal/legal-source-register.json
          if [ -d docs/legal/sources/ro/ecommerce ]; then
            git add docs/legal/sources/ro/ecommerce
          fi
          git commit -m "docs(legal): register Romania e-commerce source family"
          git push origin HEAD:docs/ro-launch-007-legal-corpus
