name: Validate Privacy controls

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Privacy contracts
        run: node --import tsx --test tests/privacy-policy.test.ts tests/privacy-controls-contract.test.ts tests/audit-policy.test.ts tests/audit-capture-attribution.test.ts tests/c1-audit-separation-contract.test.ts tests/audit-investigator-export.test.ts
      - name: Operational regressions
        run: pnpm exec vitest run tests/sdk.authenticate-request.test.ts tests/auth.logout.test.ts tests/order-state-machine.test.ts tests/order-management-integration-contract.test.ts tests/marketplace-controls-integration-contract.test.ts tests/live-tracking-security.test.ts tests/operational-safety-certification.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
