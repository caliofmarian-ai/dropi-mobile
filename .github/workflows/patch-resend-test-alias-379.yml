name: Patch Resend Test Alias 379

on:
  push:
    branches:
      - fix/resend-test-alias-delivery-379
    paths:
      - .github/workflows/patch-resend-test-alias-379.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resend-test-alias-delivery-379
          fetch-depth: 0
      - name: Route canonical test recovery to base inbox
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('server/auth-router.ts')
          text = p.read_text()
          anchor = 'import { requirePhantomAdminId } from "./audit-policy";\n'
          addition = 'import { DROPI_TEST_BASE_INBOX, TEST_ROLE_IDENTITIES } from "../shared/test-role-accounts";\n'
          if addition not in text:
              text = text.replace(anchor, anchor + addition)

          helper_anchor = '// ===== VALIDATION SCHEMAS =====\n'
          helper = '''const CANONICAL_TEST_ACCOUNT_EMAILS = new Set(\n  TEST_ROLE_IDENTITIES.flatMap((identity) => [identity.humanEmail, identity.aiEmail])\n    .map((email) => email.trim().toLowerCase()),\n);\n\nfunction resolveRecoveryDeliveryEmail(accountEmail: string): string {\n  const normalized = accountEmail.trim().toLowerCase();\n  return CANONICAL_TEST_ACCOUNT_EMAILS.has(normalized)\n    ? DROPI_TEST_BASE_INBOX\n    : normalized;\n}\n\n'''
          if helper not in text:
              text = text.replace(helper_anchor, helper + helper_anchor)

          old = '    await db.setResetToken(user.id, code, expiry);\n\n    await createAuditLog({'
          new = '    await db.setResetToken(user.id, code, expiry);\n    const recoveryDeliveryEmail = resolveRecoveryDeliveryEmail(normalizedEmail);\n\n    await createAuditLog({'
          if old not in text:
              raise SystemExit('reset-token anchor not found')
          text = text.replace(old, new, 1)

          old_details = '      details: { email: normalizedEmail, codeGenerated: true },\n'
          new_details = '      details: {\n        email: normalizedEmail,\n        codeGenerated: true,\n        recoveryDeliveryRoutedToBaseInbox: recoveryDeliveryEmail !== normalizedEmail,\n      },\n'
          if old_details not in text:
              raise SystemExit('audit details anchor not found')
          text = text.replace(old_details, new_details, 1)

          old_send = '    const emailSent = await sendRecoveryEmail(normalizedEmail, code);\n'
          new_send = '    const emailSent = await sendRecoveryEmail(recoveryDeliveryEmail, code);\n'
          if old_send not in text:
              raise SystemExit('recovery send anchor not found')
          text = text.replace(old_send, new_send, 1)
          p.write_text(text)
          PY
      - name: Extend recovery tests
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/auth.forgot-password.test.ts')
          text = p.read_text()
          anchor = '  it("does not log the 6-digit reset code to any console channel", async () => {\n'
          tests = '''  it("routes canonical TEST HUMAN recovery to the governed base inbox", async () => {\n    const alias = "dropi.deliveries+human.delivery_partner@gmail.com";\n    dbMock.getUserByEmail.mockResolvedValue({\n      id: 151,\n      email: alias,\n      dropiRole: "delivery_partner",\n      channel: "C1",\n      isAIAgent: false,\n    });\n    const caller = dropiAuthRouter.createCaller(createPublicContext());\n\n    await caller.forgotPassword({ email: alias });\n\n    expect(dbMock.getUserByEmail).toHaveBeenCalledWith(alias);\n    expect(dbMock.setResetToken).toHaveBeenCalledWith(151, expect.stringMatching(/^\\d{6}$/), expect.any(Date));\n    expect(mailMock.sendPlatformEmail).toHaveBeenCalledWith(\n      expect.objectContaining({ to: "dropi.deliveries@gmail.com" }),\n    );\n  });\n\n  it("routes canonical TEST AI recovery to the governed base inbox", async () => {\n    const alias = "dropi.deliveries+ai.delivery_partner@gmail.com";\n    dbMock.getUserByEmail.mockResolvedValue({\n      id: 152,\n      email: alias,\n      dropiRole: "delivery_partner",\n      channel: "C1",\n      isAIAgent: true,\n    });\n    const caller = dropiAuthRouter.createCaller(createPublicContext());\n\n    await caller.forgotPassword({ email: alias });\n\n    expect(mailMock.sendPlatformEmail).toHaveBeenCalledWith(\n      expect.objectContaining({ to: "dropi.deliveries@gmail.com" }),\n    );\n  });\n\n  it("keeps a normal user's own address as the recovery delivery target", async () => {\n    dbMock.getUserByEmail.mockResolvedValue({\n      id: 9,\n      email: "normal.user@example.org",\n      dropiRole: "customer",\n      channel: "C1",\n      isAIAgent: false,\n    });\n    const caller = dropiAuthRouter.createCaller(createPublicContext());\n\n    await caller.forgotPassword({ email: "normal.user@example.org" });\n\n    expect(mailMock.sendPlatformEmail).toHaveBeenCalledWith(\n      expect.objectContaining({ to: "normal.user@example.org" }),\n    );\n  });\n\n'''
          if tests not in text:
              if anchor not in text:
                  raise SystemExit('test insertion anchor not found')
              text = text.replace(anchor, tests + anchor, 1)
          p.write_text(text)
          PY
      - name: Verify and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/auth-router.ts tests/auth.forgot-password.test.ts
          git commit -m "AUTH-379: route canonical test recovery to base inbox"
          git push origin HEAD:fix/resend-test-alias-delivery-379
