name: Materialize privacy rights reporting

on:
  push:
    branches:
      - m2/privacy-rights-reporting
    paths:
      - scripts/materialize_privacy_rights_reporting.py
      - .github/workflows/materialize-privacy-rights-reporting.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Materialize schema API audit and UI wiring
        run: python scripts/materialize_privacy_rights_reporting.py

      - name: Privacy rights and reporting contracts
        run: >-
          node --import tsx --test
          tests/privacy-rights-policy.test.ts
          tests/authority-report-policy.test.ts
          tests/privacy-rights-reporting-contract.test.ts
          tests/privacy-policy.test.ts
          tests/privacy-controls-contract.test.ts
          tests/audit-policy.test.ts
          tests/audit-capture-attribution.test.ts
          tests/c1-audit-separation-contract.test.ts
          tests/audit-investigator-export.test.ts

      - name: Operational regressions
        run: >-
          pnpm exec vitest run
          tests/sdk.authenticate-request.test.ts
          tests/auth.logout.test.ts
          tests/order-state-machine.test.ts
          tests/order-management-integration-contract.test.ts
          tests/marketplace-controls-integration-contract.test.ts
          tests/live-tracking-security.test.ts
          tests/operational-safety-certification.test.ts

      - name: TypeScript
        run: pnpm check

      - name: Whitespace
        run: git diff --check

      - name: Commit verified privacy rights reporting
        run: |
          rm .github/workflows/materialize-privacy-rights-reporting.yml
          rm scripts/materialize_privacy_rights_reporting.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: deliver governed privacy rights and authority evidence packs"
          git push
