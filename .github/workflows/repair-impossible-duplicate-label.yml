name: One-time repair duplicate IMPL-117 label

on:
  push:
    branches:
      - copilot/create-github-planning-materialization
    paths:
      - ".github/workflows/repair-impossible-duplicate-label.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout planning branch
        uses: actions/checkout@v4
        with:
          ref: copilot/create-github-planning-materialization
          fetch-depth: 0

      - name: Repair exactly one impossible duplicate label
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json
          from pathlib import Path

          path = Path("docs/planning/github_materialization_plan.json")
          plan = json.loads(path.read_text(encoding="utf-8"))
          target = next((item for item in plan["issues"] if item.get("id") == "IMPL-117"), None)
          if target is None:
              raise SystemExit("IMPL-117 not found")

          labels = list(target.get("labels", []))
          duplicate = "domain:deployment"
          if labels.count(duplicate) != 2:
              raise SystemExit(f"Expected exactly two {duplicate!r} labels, found {labels.count(duplicate)}: {labels}")

          normalized = list(dict.fromkeys(labels))
          if len(normalized) != len(labels) - 1 or normalized.count(duplicate) != 1:
              raise SystemExit(f"Unexpected normalization result: {normalized}")

          target["labels"] = normalized
          path.write_text(json.dumps(plan, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("IMPL-117 label list repaired deterministically.")
          PYEOF

      - name: Verify focused plan invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json
          from pathlib import Path

          plan = json.loads(Path("docs/planning/github_materialization_plan.json").read_text(encoding="utf-8"))
          ids = [item["id"] for item in plan["issues"]]
          labels = [item["name"] for item in plan["labels"]]
          milestones = [item["title"] for item in plan["milestones"]]
          assert len(ids) == 228 and len(set(ids)) == 228
          assert len(labels) == 212 and len(set(labels)) == 212
          assert len(milestones) == 7 and len(set(milestones)) == 7
          for issue in plan["issues"]:
              issue_labels = issue.get("labels", [])
              if len(issue_labels) != len(set(issue_labels)):
                  raise SystemExit(f"Duplicate labels remain on {issue['id']}: {issue_labels}")
          print("Plan invariants PASS; no issue contains duplicate labels.")
          PYEOF
          python -m unittest -v tests/test_materialize_github_planning.py
          git diff --check

      - name: Commit repair and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-impossible-duplicate-label.yml
          git add docs/planning/github_materialization_plan.json
          git commit -m "planning: normalize IMPL-117 label set"
          git push origin HEAD:copilot/create-github-planning-materialization
