name: Apply Marketplace controls

on:
  push:
    branches:
      - m1/marketplace-controls

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply governed Marketplace controls
        run: python3 scripts/apply_marketplace_controls.py

      - name: Run Marketplace policy certification
        run: >-
          node --import tsx --test
          tests/marketplace-policy.test.ts
          tests/marketplace-controls-contract.test.ts

      - name: Run M1 regression certification
        run: >-
          pnpm exec vitest run
          tests/order-state-machine.test.ts
          tests/order-transition-notifications.test.ts
          tests/order-management-integration-contract.test.ts
          tests/push-state-notifications.test.ts
          tests/push-state-integration-contract.test.ts
          tests/live-tracking-security.test.ts
          tests/live-tracking-client-contract.test.ts
          tests/operational-safety-certification.test.ts

      - name: TypeScript check
        run: pnpm check

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit verified changes
        run: |
          rm .github/workflows/apply-marketplace-controls.yml
          rm scripts/apply_marketplace_controls.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: enforce governed Marketplace listing controls"
          git push origin HEAD:m1/marketplace-controls
