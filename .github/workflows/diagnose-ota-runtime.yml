name: Diagnose EAS OTA Runtime

on:
  push:
    branches:
      - ops/ota-runtime-diagnostic
    paths:
      - .github/workflows/diagnose-ota-runtime.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Generate clean Android native project
        run: pnpm exec expo prebuild --platform android --clean --no-install
      - name: Generate local fingerprint
        run: eas fingerprint:generate --platform android --json --non-interactive
      - name: Publish isolated diagnostic Android update
        run: eas update --branch ota-runtime-diagnostic --platform android --message "OTA runtime diagnostic after clean prebuild" --non-interactive
      - name: Inspect diagnostic update
        run: eas update:list --branch ota-runtime-diagnostic --limit 1 --json
