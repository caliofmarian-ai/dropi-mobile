name: Diagnose EAS OTA Runtime

on:
  push:
    branches:
      - ops/ota-runtime-diagnostic
    paths:
      - .github/workflows/diagnose-ota-runtime.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS account
        run: eas whoami
      - name: Compare finished APK with current Android OTA
        run: eas fingerprint:compare --build-id 7c98a438-9f8e-4b75-a202-e08079ef6206 --update-id 01a066b7-5e28-7199-9ce5-80eae0b62fa3 --json --non-interactive
