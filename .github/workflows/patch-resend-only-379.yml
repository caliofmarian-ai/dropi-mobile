name: Patch Resend Only 379

on:
  push:
    branches:
      - fix/resend-only-recovery-379
    paths:
      - .github/workflows/patch-resend-only-379.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resend-only-recovery-379
          fetch-depth: 0
      - name: Make canonical mail module Resend-only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("server/_core/mail.ts")
          text = path.read_text()
          text = text.replace('import nodemailer from "nodemailer";\n', '')
          text = text.replace('import { resolve4 } from "node:dns/promises";\n', '')
          text = re.sub(
              r'type MailTransportConfig =\n.*?;\n\nconst RESEND_EMAIL_API_URL',
              'type MailTransportConfig = {\n  mode: "resend";\n  from: string;\n  apiKey: string;\n};\n\nconst RESEND_EMAIL_API_URL',
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r'function getMailFromAddress\(.*?\n}\n\nfunction getResendFromAddress',
              'function getResendFromAddress',
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r'export function resolveMailTransportConfig\(.*?\nfunction escapeHtml',
              '''export function resolveMailTransportConfig(\n  env: MailEnv = process.env,\n): MailTransportConfig | null {\n  const apiKey = env.RESEND_API_KEY?.trim() || "";\n  const from = env.RESEND_FROM?.trim() || "";\n\n  if (!apiKey || !from) return null;\n\n  return { mode: "resend", from, apiKey };\n}\n\nfunction escapeHtml''',
              text,
              count=1,
              flags=re.S,
          )
          marker = '  if (config.mode === "resend") {\n    return sendViaResend(config, preparedInput);\n  }'
          index = text.find(marker)
          if index < 0:
              raise SystemExit("mail transport tail marker not found")
          text = text[:index] + '  return sendViaResend(config, preparedInput);\n}\n'
          text = text.replace(
              'console.error(`[MAIL] ${input.logLabel} skipped: no mail transport configured`);',
              'console.error(`[MAIL] ${input.logLabel} skipped: Resend is not configured`);',
          )
          path.write_text(text)
          PY
      - name: Verify patch scope
        run: |
          grep -q 'mode: "resend"' server/_core/mail.ts
          grep -q 'Resend is not configured' server/_core/mail.ts
          if grep -E 'nodemailer|mode: "smtp"|mode: "gmail"|smtp\.gmail\.com' server/_core/mail.ts; then
            echo "Legacy mail transport remains"
            exit 1
          fi
      - name: Commit mail module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/_core/mail.ts
          git commit -m "AUTH-379: enforce Resend-only mail transport"
          git push origin HEAD:fix/resend-only-recovery-379
