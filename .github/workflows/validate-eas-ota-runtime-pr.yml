name: Validate EAS OTA Runtime

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/eas-update.yml
      - .github/workflows/eas-build-android.yml
      - .github/workflows/validate-eas-ota-runtime-pr.yml
      - app.config.ts
      - eas.json
      - package.json
      - pnpm-lock.yaml
      - tests/eas-ota-runtime-contract.test.ts

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: EAS OTA runtime contract
        run: node --import tsx --test tests/eas-ota-runtime-contract.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
