name: Validate Marketplace controls

on:
  pull_request:
    branches:
      - main
    paths:
      - shared/marketplace-policy.ts
      - server/marketplace-router.ts
      - server/moderation-engine.ts
      - server/order-management-service.ts
      - server/operations-router.ts
      - app/merchant/product-new.tsx
      - app/merchant/store-setup.tsx
      - app/merchant/product/[id].tsx
      - app/admin/marketplace-overview.tsx
      - tests/marketplace-policy.test.ts
      - tests/marketplace-controls-contract.test.ts
      - .github/workflows/validate-marketplace-controls-pr.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certification:
    name: M1 Marketplace controls certification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Marketplace policy certification
        run: >-
          node --import tsx --test
          tests/marketplace-policy.test.ts
          tests/marketplace-controls-contract.test.ts

      - name: Run M1 regression certification
        run: >-
          pnpm exec vitest run
          tests/order-state-machine.test.ts
          tests/order-transition-notifications.test.ts
          tests/order-management-integration-contract.test.ts
          tests/push-state-notifications.test.ts
          tests/push-state-integration-contract.test.ts
          tests/live-tracking-security.test.ts
          tests/live-tracking-client-contract.test.ts
          tests/operational-safety-certification.test.ts

      - name: TypeScript check
        run: pnpm check

      - name: Reject whitespace errors
        run: git diff --check origin/main...HEAD
