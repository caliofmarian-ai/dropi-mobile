name: GitHub Build — Android APK (standalone owner test)

# Builds a standalone Android APK for Project Owner/device acceptance.
# This artifact MUST launch on a physical phone without Metro, a computer,
# Expo Dev Client, or any local development server.
on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-standalone-owner-apk

jobs:
  build:
    name: Build standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate EXPO_PUBLIC_API_BASE_URL
        run: |
          if [ -z "${{ vars.EXPO_PUBLIC_API_BASE_URL }}" ]; then
            echo "ERROR: EXPO_PUBLIC_API_BASE_URL is not configured in GitHub Variables"
            exit 1
          fi
          if echo "${{ vars.EXPO_PUBLIC_API_BASE_URL }}" | grep -qE "(localhost|127\.0\.0\.1)"; then
            echo "ERROR: EXPO_PUBLIC_API_BASE_URL cannot target localhost on a standalone phone build"
            exit 1
          fi
          if ! echo "${{ vars.EXPO_PUBLIC_API_BASE_URL }}" | grep -qE '^https://'; then
            echo "ERROR: EXPO_PUBLIC_API_BASE_URL must use HTTPS"
            exit 1
          fi
          echo "Public mobile API configuration is valid"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean --no-install
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build standalone release APK with embedded JS bundle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}

      - name: Locate standalone APK
        id: locate_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: standalone release APK was not found after build"
            exit 1
          fi
          echo "Standalone APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify JavaScript bundle is embedded
        run: |
          APK_PATH="${{ steps.locate_apk.outputs.apk_path }}"
          if ! unzip -l "$APK_PATH" | grep -q "assets/index.android.bundle"; then
            echo "ERROR: APK does not contain an embedded React Native JS bundle"
            echo "This artifact would require Metro and must not be delivered to the Project Owner."
            exit 1
          fi
          echo "Embedded JS bundle verified — APK is not Metro-dependent"

      - name: Upload standalone owner APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: dropi-standalone-owner-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 7
