name: GitHub Build — Android APK (development/debug)

# Construiește APK-ul Android debug direct pe GitHub-hosted runner, fără EAS.
# Se rulează EXCLUSIV manual (workflow_dispatch).
# APK-ul rezultat este disponibil ca GitHub Actions artifact (7 zile).
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate EXPO_PUBLIC_API_BASE_URL
        run: |
          if [ -z "${{ vars.EXPO_PUBLIC_API_BASE_URL }}" ]; then
            echo "❌ EROARE: EXPO_PUBLIC_API_BASE_URL nu este setat în GitHub Variables"
            echo "   → GitHub → Settings → Secrets and variables → Actions → Variables → adaugă EXPO_PUBLIC_API_BASE_URL"
            echo "   → Valoarea: URL-ul public Railway al backend-ului (ex: https://dropi-xxx.up.railway.app)"
            exit 1
          fi
          if echo "${{ vars.EXPO_PUBLIC_API_BASE_URL }}" | grep -qE "(localhost|127\.0\.0\.1)"; then
            echo "❌ EROARE: EXPO_PUBLIC_API_BASE_URL nu poate fi localhost sau 127.0.0.1 pe mobile"
            echo "   → Folosește URL-ul public Railway al backend-ului."
            exit 1
          fi
          echo "✅ EXPO_PUBLIC_API_BASE_URL este configurat: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (Android)
        if: ${{ !hashFiles('android/build.gradle') }}
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}

      - name: Locate APK
        id: locate_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ EROARE: APK nu a fost găsit după build"
            exit 1
          fi
          echo "✅ APK găsit: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropi-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 7
