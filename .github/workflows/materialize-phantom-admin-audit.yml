name: Materialize phantom ADMIN audit correction

on:
  push:
    branches: [m2/c1-audit-separation]
    paths:
      - .github/workflows/materialize-phantom-admin-audit.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2/c1-audit-separation
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply phantom ADMIN audit correction
        run: python scripts/patch_phantom_admin_audit.py
      - name: Audit contract tests
        run: >-
          node --import tsx --test
          tests/audit-policy.test.ts
          tests/request-session.test.ts
          tests/c1-audit-separation-contract.test.ts
          tests/marketplace-experience-contract.test.ts
      - name: Authentication regressions
        run: >-
          pnpm exec vitest run
          tests/sdk.authenticate-request.test.ts
          tests/order-management-integration-contract.test.ts
          tests/operational-safety-certification.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Whitespace
        run: git diff --check
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-phantom-admin-audit.yml scripts/patch_phantom_admin_audit.py
          git add server tests
          git commit -m "fix: keep phantom controls in ADMIN audit stream"
          git push origin HEAD:m2/c1-audit-separation
