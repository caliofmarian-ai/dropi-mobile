name: Validate Legal Source Corpus

on:
  pull_request:
    branches:
      - main
    paths:
      - canonical/LEGAL_COMPLIANCE_SOURCE_OF_TRUTH.md
      - docs/legal/**
      - scripts/validate-legal-sources.mjs
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/validate-legal-sources-pr.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Legal source corpus integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate registered legal sources, hashes and corpus coverage
        run: pnpm legal:sources:validate

      - name: Reject whitespace errors in legal/canonical changes
        run: git diff --check "${{ github.event.pull_request.base.sha || github.sha }}" "${{ github.event.pull_request.head.sha || github.sha }}"
