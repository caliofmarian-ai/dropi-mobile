name: Branch repair — regenerate React lockfile

on:
  push:
    branches:
      - fix/android-standalone-owner-apk

permissions:
  contents: write

jobs:
  repair-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/android-standalone-owner-apk
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify repaired React runtime versions
        run: |
          node <<'NODE'
          const pkg = require('./package.json');
          if (pkg.dependencies.react !== '19.1.0') throw new Error('React must be 19.1.0 for Expo SDK 54 / RN 0.81');
          if (pkg.dependencies['react-dom'] !== '19.1.0') throw new Error('react-dom must match React 19.1.0');
          if (pkg.dependencies['react-native'] !== '0.81.5') throw new Error('Unexpected React Native version');
          NODE
          grep -q 'specifier: 19.1.0' pnpm-lock.yaml

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml already matches package.json'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'fix(android): regenerate lockfile for React 19.1.0'
          git push origin HEAD:fix/android-standalone-owner-apk
