name: Materialize operational trace v2

on:
  push:
    branches:
      - m2/operational-evidence-chain
    paths:
      - .github/workflows/materialize-operational-trace-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2/operational-evidence-chain
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scope the duplicated B2B patch anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/patch_operational_trace.py')
          text = path.read_text()
          helper_anchor = 'def replace_once(text, old, new, label):\n'
          helper = '''def replace_first(text, old, new, label):
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f"{label}: expected at least one match, found {count}")
              return text.replace(old, new, 1)


          '''
          text = text.replace(helper_anchor, helper + helper_anchor, 1)
          label = '    "B2B pilot operational evidence",\n)'
          pos = text.index(label)
          start = text.rfind('s = replace_once(', 0, pos)
          if start < 0:
              raise SystemExit('B2B pilot replace call not found')
          text = text[:start] + text[start:].replace('s = replace_once(', 's = replace_first(', 1)
          path.write_text(text)
          PY
      - name: Apply controlled integration patch
        run: python scripts/patch_operational_trace.py
      - name: Operational trace policy and source contracts
        run: node --import tsx --test tests/operational-trace-policy.test.ts tests/operational-trace-contract.test.ts
      - name: Order, tracking and safety regressions
        run: >-
          pnpm exec vitest run
          tests/order-state-machine.test.ts
          tests/order-transition-notifications.test.ts
          tests/order-management-integration-contract.test.ts
          tests/push-state-notifications.test.ts
          tests/push-state-integration-contract.test.ts
          tests/live-tracking-security.test.ts
          tests/live-tracking-client-contract.test.ts
          tests/operational-safety-certification.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Whitespace
        run: git diff --check
      - name: Commit verified implementation and remove temporary materializers
        run: |
          rm -f scripts/patch_operational_trace.py .github/workflows/materialize-operational-trace.yml .github/workflows/materialize-operational-trace-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: deliver operational evidence chain" || exit 0
          git push origin HEAD:m2/operational-evidence-chain
