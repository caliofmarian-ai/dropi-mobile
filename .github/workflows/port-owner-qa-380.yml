name: Port owner QA 380

on:
  push:
    branches:
      - fix/owner-mission-fixtures-380-v2
    paths:
      - .github/workflows/port-owner-qa-380.yml

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/owner-mission-fixtures-380-v2
          fetch-depth: 0
      - name: Port reviewed backend changes
        shell: bash
        run: |
          git fetch origin fix/owner-mission-fixtures-380
          git show origin/fix/owner-mission-fixtures-380:server/operations-router.ts > server/operations-router.ts
          git show origin/fix/owner-mission-fixtures-380:server/order-management-service.ts > server/order-management-service.ts
          git show origin/fix/owner-mission-fixtures-380:server/phantom-console-router.ts > server/phantom-console-router.ts
          python <<'PY'
          from pathlib import Path
          p = Path('server/phantom-console-router.ts')
          text = p.read_text()
          text = text.replace('  email: users.email,\n  dropiRole:', '  email: users.email,\n  username: users.username,\n  dropiRole:', 1)
          text = text.replace('          like(users.email, `%${search}%`),\n          like(users.dropiRole,', '          like(users.email, `%${search}%`),\n          like(users.username, `%${search}%`),\n          like(users.dropiRole,', 1)
          p.write_text(text)
          PY
          git config user.name "DROPi Automation"
          git config user.email "dropi.deliveries@gmail.com"
          git add server/operations-router.ts server/order-management-service.ts server/phantom-console-router.ts
          git commit -m "QA-380: port governed mission fixture backend onto username auth"
          git push origin HEAD:fix/owner-mission-fixtures-380-v2
