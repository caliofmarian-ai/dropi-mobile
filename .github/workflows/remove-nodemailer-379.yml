name: Remove Legacy Mail Packages 379

on:
  push:
    branches:
      - fix/resend-only-recovery-379
    paths:
      - .github/workflows/remove-nodemailer-379.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resend-only-recovery-379
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove legacy mail packages
        run: pnpm remove nodemailer @types/nodemailer
      - name: Commit dependency cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "AUTH-379: remove legacy Nodemailer dependencies"
          git push origin HEAD:fix/resend-only-recovery-379
