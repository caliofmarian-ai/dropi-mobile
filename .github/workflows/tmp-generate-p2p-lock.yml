name: Temporary P2P lockfile generation

on:
  push:
    branches:
      - p2p/listing-governance-media

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lock-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: p2p/listing-governance-media
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Generate lockfile only
        run: pnpm install --lockfile-only

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "[lock-generated] P2P: refresh pnpm lock for Expo image picker"
          git push origin HEAD:p2p/listing-governance-media
