name: Patch Independent Test Passwords 397

on:
  push:
    branches:
      - fix/test-account-independent-passwords-397-final
    paths:
      - .github/workflows/patch-independent-test-passwords-397.yml
      - scripts/patch-independent-test-passwords-397.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/test-account-independent-passwords-397-final
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: python scripts/patch-independent-test-passwords-397.py
      - run: pnpm install --frozen-lockfile
      - name: Focused tests
        run: pnpm exec vitest run tests/test-account-provisioning-contract.test.ts tests/test-account-independent-passwords-397.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/test-account-provisioning.ts app/admin/phantom-console.tsx tests/test-account-provisioning-contract.test.ts tests/test-account-independent-passwords-397.test.ts
          git commit -m "AUTH-397: preserve independent TEST account passwords"
          git push origin HEAD:fix/test-account-independent-passwords-397-final
