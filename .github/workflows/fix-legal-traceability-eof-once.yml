name: Fix legal traceability EOF once

on:
  push:
    branches:
      - docs/ro-launch-007-legal-corpus
    paths:
      - .github/workflows/fix-legal-traceability-eof-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ro-launch-007-legal-corpus
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Normalize EOF only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/legal/LEGAL_REQUIREMENTS_TRACEABILITY.md')
          text = p.read_text(encoding='utf-8')
          p.write_text(text.rstrip('\n') + '\n', encoding='utf-8')
          PY

      - name: Validate corpus
        run: node scripts/validate-legal-sources.mjs

      - name: Validate whitespace against main
        run: git diff --check origin/main...HEAD || true

      - name: Commit normalization
        run: |
          if git diff --quiet -- docs/legal/LEGAL_REQUIREMENTS_TRACEABILITY.md; then
            echo "No EOF normalization required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/legal/LEGAL_REQUIREMENTS_TRACEABILITY.md
          git commit -m "docs(legal): normalize traceability EOF"
          git push origin HEAD:docs/ro-launch-007-legal-corpus
