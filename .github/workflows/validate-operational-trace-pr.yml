name: Validate Operational Trace

on:
  pull_request:
    branches: [main]
    paths:
      - "drizzle/operational-trace-schema.ts"
      - "drizzle/0017_operational_evidence_chain.sql"
      - "drizzle/meta/_journal.json"
      - "drizzle.config.ts"
      - "server/operational-trace-service.ts"
      - "server/order-management-service.ts"
      - "server/operations-router.ts"
      - "server/live-tracking.ts"
      - "server/b2b-router.ts"
      - "shared/operational-trace-policy.ts"
      - "app/pilot/complete-order.tsx"
      - "app/pilot/complete-mission.tsx"
      - "app/order/[id].tsx"
      - "app/mission/[id].tsx"
      - "app/(tabs)/index.tsx"
      - "tests/operational-trace-policy.test.ts"
      - "tests/operational-trace-contract.test.ts"
      - "tests/operational-mission-safety-contract.test.ts"
      - ".github/workflows/validate-operational-trace-pr.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Operational trace and mission contracts
        run: >-
          node --import tsx --test
          tests/operational-trace-policy.test.ts
          tests/operational-trace-contract.test.ts
          tests/operational-mission-safety-contract.test.ts
          tests/audit-capture-attribution.test.ts
      - name: Delivery, tracking and safety regressions
        run: >-
          pnpm exec vitest run
          tests/order-state-machine.test.ts
          tests/order-transition-notifications.test.ts
          tests/order-management-integration-contract.test.ts
          tests/push-state-notifications.test.ts
          tests/push-state-integration-contract.test.ts
          tests/live-tracking-security.test.ts
          tests/live-tracking-client-contract.test.ts
          tests/operational-safety-certification.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Diff integrity
        run: git diff --check origin/main...HEAD
