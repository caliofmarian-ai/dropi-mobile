name: Apply Romania launch traceability 2026-09-15

on:
  push:
    branches:
      - docs/ro-launch-007-legal-corpus
    paths:
      - scripts/apply-ro-launch-traceability-2026-09-15.mjs
      - .github/workflows/apply-ro-launch-traceability-2026-09-15.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ro-launch-007-legal-corpus
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Apply Romania launch traceability
        run: node scripts/apply-ro-launch-traceability-2026-09-15.mjs

      - name: Validate legal source corpus
        run: node scripts/validate-legal-sources.mjs

      - name: Commit canonical traceability update
        run: |
          if git diff --quiet -- docs/legal/LEGAL_REQUIREMENTS_TRACEABILITY.md; then
            echo "No traceability changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/legal/LEGAL_REQUIREMENTS_TRACEABILITY.md
          git commit -m "docs(legal): integrate Romania launch traceability"
          git push origin HEAD:docs/ro-launch-007-legal-corpus
