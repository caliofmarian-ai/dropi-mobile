name: EAS Update (OTA)

# Rulează automat la fiecare push pe main
# Trimite codul nou direct pe telefon fără reconstruire APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate EAS project ID
        run: |
          if grep -q "YOUR_EAS_PROJECT_ID" app.config.ts; then
            echo "❌ EROARE: app.config.ts conține YOUR_EAS_PROJECT_ID (placeholder neînlocuit)"
            echo "   → Mergi la https://expo.dev, creează proiectul și înlocuiește placeholder-ul."
            exit 1
          fi
          echo "✅ EAS Project ID este configurat corect"

      - name: Validate EXPO_TOKEN secret
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ EROARE: EXPO_TOKEN nu este setat în GitHub Secrets"
            echo "   → Mergi la GitHub → Settings → Secrets → Actions → adaugă EXPO_TOKEN"
            exit 1
          fi
          echo "✅ EXPO_TOKEN este configurat"

      - name: Validate EXPO_PUBLIC_API_BASE_URL secret
        run: |
          if [ -z "${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" ]; then
            echo "❌ EROARE: EXPO_PUBLIC_API_BASE_URL nu este setat în GitHub Secrets"
            echo "   → Mergi la GitHub → Settings → Secrets → Actions → adaugă EXPO_PUBLIC_API_BASE_URL cu URL-ul public Railway"
            exit 1
          fi

          case "${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" in
            http://localhost*|https://localhost*|http://127.0.0.1*|https://127.0.0.1*)
              echo "❌ EROARE: EXPO_PUBLIC_API_BASE_URL nu poate fi localhost/127.0.0.1 pentru OTA mobil real"
              echo "   → Folosește URL public Railway (ex: https://<serviciu>.up.railway.app)"
              exit 1
              ;;
          esac

          echo "✅ EXPO_PUBLIC_API_BASE_URL este valid pentru OTA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish EAS Update
        run: eas update --branch development --message "$(git log -1 --pretty=format:'%s')" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
