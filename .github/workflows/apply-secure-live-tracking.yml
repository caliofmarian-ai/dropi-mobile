name: Apply secure live tracking

on:
  push:
    branches:
      - m1/secure-live-tracking
    paths:
      - .github/workflows/apply-secure-live-tracking.yml
      - scripts/apply_live_tracking_ui_patch.py

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1/secure-live-tracking
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply client wiring patch
        run: python scripts/apply_live_tracking_ui_patch.py

      - name: Run security regression tests
        run: pnpm exec vitest run tests/live-tracking-security.test.ts tests/live-tracking-client-contract.test.ts tests/operational-safety-certification.test.ts

      - name: TypeScript check
        run: pnpm check

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit verified changes
        run: |
          rm .github/workflows/apply-secure-live-tracking.yml
          rm scripts/apply_live_tracking_ui_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: wire authenticated live tracking through real mission context"
          git push origin HEAD:m1/secure-live-tracking
