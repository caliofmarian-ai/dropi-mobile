name: TEMP Generate Account Media Snapshot

on:
  push:
    branches:
      - fix/dropi-owned-account-media-368
    paths:
      - .github/workflows/tmp-generate-account-media-snapshot.yml
      - drizzle/**
      - drizzle.config.ts

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate current schema snapshot
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/dropi
        run: pnpm exec drizzle-kit generate --name account_media_snapshot_probe
      - name: Materialize 0021 snapshot without duplicate migration
        shell: bash
        run: |
          set -euo pipefail
          probe_snapshot="drizzle/meta/0022_snapshot.json"
          probe_sql="drizzle/0022_account_media_snapshot_probe.sql"
          if [ ! -f "$probe_snapshot" ]; then
            echo "No probe snapshot generated; schema is already current."
            exit 0
          fi
          cp "$probe_snapshot" drizzle/meta/0021_snapshot.json
          git restore drizzle/meta/_journal.json
          rm -f "$probe_snapshot" "$probe_sql"
          git add drizzle/meta/0021_snapshot.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No snapshot change to commit."
            exit 0
          fi
          git commit -m "P0: materialize Drizzle snapshot through 0021"
          git push origin HEAD:fix/dropi-owned-account-media-368
      - name: Show final status
        run: git status --short && ls -la drizzle/meta | tail -20
