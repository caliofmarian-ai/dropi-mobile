name: TEMP Generate Account Media Snapshot

on:
  push:
    branches:
      - fix/dropi-owned-account-media-368
    paths:
      - .github/workflows/tmp-generate-account-media-snapshot.yml
      - drizzle/**
      - drizzle.config.ts

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate snapshot probe
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/dropi
        run: pnpm exec drizzle-kit generate --name account_media_snapshot_probe
      - name: Show generated files
        run: git status --short && ls -la drizzle/meta | tail -20
      - uses: actions/upload-artifact@v4
        with:
          name: account-media-drizzle-probe
          path: |
            drizzle/*.sql
            drizzle/meta/*.json
