name: Materialize Security Assurance

on:
  push:
    branches:
      - m2/security-assurance
    paths:
      - .github/workflows/materialize-security-assurance.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply security assurance corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old!r}")
              p.write_text(text.replace(old, new))

          replace_exact(
              "server/db.ts",
              'import { eq, and, desc, gte, lte, like, or, sql } from "drizzle-orm";',
              'import { randomUUID } from "node:crypto";\nimport { eq, and, desc, gte, lte, like, or, sql } from "drizzle-orm";',
          )
          replace_exact(
              "server/db.ts",
              'import { ENV } from "./_core/env";',
              'import { ENV } from "./_core/env";\nimport { resolveUserVerificationForCreate, verificationPatchForRoleChange } from "./user-verification-policy";',
          )
          replace_exact(
              "server/db.ts",
              'const openId = `dropi_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;',
              'const openId = `dropi_${randomUUID()}`;',
          )
          replace_exact(
              "server/db.ts",
              'isVerified: data.isVerified ?? true,',
              'isVerified: resolveUserVerificationForCreate(data.dropiRole, data.isVerified),',
          )
          replace_exact(
              "server/db.ts",
              'await db.update(users).set({ dropiRole: dropiRole as any, channel: channel as any }).where(eq(users.id, userId));',
              'await db.update(users).set({\n    dropiRole: dropiRole as any,\n    channel: channel as any,\n    ...verificationPatchForRoleChange(dropiRole),\n  }).where(eq(users.id, userId));',
          )

          replace_exact(
              "server/auth-router.ts",
              'import bcrypt from "bcryptjs";',
              'import bcrypt from "bcryptjs";\nimport { randomInt } from "node:crypto";',
          )
          replace_exact(
              "server/auth-router.ts",
              'String(Math.floor(100000 + Math.random() * 900000))',
              'String(randomInt(100000, 1_000_000))',
              expected=3,
          )
          PY
      - name: Security assurance contracts
        run: node --import tsx --test tests/security-assurance-policy.test.ts tests/security-assurance-contract.test.ts
      - name: Security baseline regressions
        run: node --import tsx --test tests/security-baseline-policy.test.ts tests/security-crypto.test.ts tests/outbound-url-policy.test.ts tests/security-baseline-contract.test.ts
      - name: Auth and operational security regressions
        run: pnpm exec vitest run tests/auth.login-normalize.test.ts tests/auth.login-session.test.ts tests/live-tracking-security.test.ts tests/live-tracking-client-contract.test.ts tests/operational-safety-certification.test.ts tests/order-management-integration-contract.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Whitespace
        run: git diff --check
      - name: Commit certified implementation and remove one-shot workflow
        run: |
          rm .github/workflows/materialize-security-assurance.yml
          git config user.name "dropi-security-assurance"
          git config user.email "dropi-security-assurance@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "security: establish cross-layer security assurance"
          git push origin HEAD:m2/security-assurance
