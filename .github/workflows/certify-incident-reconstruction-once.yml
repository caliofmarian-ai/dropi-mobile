name: Finalize incident reconstruction

on:
  push:
    branches:
      - m2/incident-reconstruction-export
    paths:
      - .github/workflows/certify-incident-reconstruction-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2/incident-reconstruction-export
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply investigator navigation link
        run: python scripts/link_incident_reconstruction.py
      - name: Incident reconstruction contracts
        run: node --import tsx --test tests/incident-reconstruction-policy.test.ts tests/incident-reconstruction-contract.test.ts tests/operational-trace-policy.test.ts tests/operational-trace-contract.test.ts tests/authority-report-policy.test.ts tests/privacy-rights-reporting-contract.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Whitespace
        run: git diff --check
      - name: Commit verified implementation and self-clean
        run: |
          rm -f scripts/link_incident_reconstruction.py .github/workflows/certify-incident-reconstruction-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: deliver incident reconstruction and authority export" || exit 0
          git push origin HEAD:m2/incident-reconstruction-export
