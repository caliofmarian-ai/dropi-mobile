name: Certify incident reconstruction once

on:
  push:
    branches:
      - m2/incident-reconstruction-export
    paths:
      - .github/workflows/certify-incident-reconstruction-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2/incident-reconstruction-export
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Link incident reconstruction from authority evidence surface
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/admin/authority-reports.tsx')
          text = path.read_text()
          old = '''        <Text className="text-xs font-semibold text-muted mb-2">TARGET AUTHORITY</Text>'''
          new = '''        <Pressable onPress={() => router.push("/admin/incident-reconstruction" as any)} className="bg-surface border border-border rounded-xl p-4 mb-4">
          <Text className="text-sm font-semibold text-foreground">Incident Reconstruction →</Text>
          <Text className="text-xs text-muted mt-1">Open factual per-incident timelines from persisted operational evidence.</Text>
        </Pressable>

        <Text className="text-xs font-semibold text-muted mb-2">TARGET AUTHORITY</Text>'''
          if text.count(old) != 1:
              raise SystemExit(f'authority report navigation anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Incident reconstruction policy and contracts
        run: >-
          node --import tsx --test
          tests/incident-reconstruction-policy.test.ts
          tests/incident-reconstruction-contract.test.ts
          tests/operational-trace-policy.test.ts
          tests/operational-trace-contract.test.ts
          tests/authority-report-policy.test.ts
          tests/privacy-rights-reporting-contract.test.ts
      - name: Operational safety regressions
        run: >-
          pnpm exec vitest run
          tests/operational-safety-certification.test.ts
          tests/live-tracking-security.test.ts
          tests/order-management-integration-contract.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Whitespace
        run: git diff --check
      - name: Commit verified UI link and self-clean
        run: |
          rm -f .github/workflows/certify-incident-reconstruction-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: deliver incident reconstruction and authority export" || exit 0
          git push origin HEAD:m2/incident-reconstruction-export
