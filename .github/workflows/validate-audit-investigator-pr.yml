name: Validate Audit investigator

on:
  pull_request:
    paths:
      - 'server/audit-router.ts'
      - 'server/audit-middleware.ts'
      - 'server/audit-policy.ts'
      - 'server/_core/trpc.ts'
      - 'server/_core/context.ts'
      - 'server/_core/sdk.ts'
      - 'server/auth-router.ts'
      - 'server/routers.ts'
      - 'app/admin/audit-logs.tsx'
      - 'tests/audit-investigator-export.test.ts'
      - 'tests/audit-policy.test.ts'
      - 'tests/request-session.test.ts'
      - 'tests/audit-capture-attribution.test.ts'
      - 'tests/c1-audit-separation-contract.test.ts'
      - '.github/workflows/validate-audit-investigator-pr.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit investigator contracts
        run: >-
          node --import tsx --test
          tests/audit-investigator-export.test.ts
          tests/audit-policy.test.ts
          tests/request-session.test.ts
          tests/audit-capture-attribution.test.ts
          tests/c1-audit-separation-contract.test.ts
      - name: Authentication and operational regressions
        run: >-
          pnpm exec vitest run
          tests/sdk.authenticate-request.test.ts
          tests/auth.logout.test.ts
          tests/order-state-machine.test.ts
          tests/order-management-integration-contract.test.ts
          tests/marketplace-controls-integration-contract.test.ts
          tests/live-tracking-security.test.ts
          tests/operational-safety-certification.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
