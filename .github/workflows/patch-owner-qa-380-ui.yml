name: Patch owner QA 380 UI

on:
  push:
    branches:
      - fix/owner-mission-fixtures-380-v2
    paths:
      - .github/workflows/patch-owner-qa-380-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/owner-mission-fixtures-380-v2
          fetch-depth: 0
      - name: Apply owner QA UI changes
        run: python scripts/patch-owner-qa-380-ui.py
      - name: Commit UI changes
        run: |
          git config user.name "DROPi Automation"
          git config user.email "dropi.deliveries@gmail.com"
          git add app/admin/phantom-console.tsx components/c1-transactional-dashboards.tsx
          git commit -m "QA-380: expose governed owner mission acceptance controls"
          git push origin HEAD:fix/owner-mission-fixtures-380-v2
