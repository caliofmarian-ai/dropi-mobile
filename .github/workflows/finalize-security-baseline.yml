name: Finalize security baseline

on:
  push:
    branches:
      - m2/security-baseline
    paths:
      - ".github/workflows/finalize-security-baseline.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2/security-baseline
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply audited completion patch
        run: python scripts/finalize_security_baseline_v6.py
      - name: Security baseline contracts
        run: node --import tsx --test tests/security-baseline-policy.test.ts tests/security-crypto.test.ts tests/outbound-url-policy.test.ts tests/security-baseline-contract.test.ts
      - name: Node-test regressions
        run: |
          node --import tsx --test \
            tests/audit-capture-attribution.test.ts \
            tests/audit-policy.test.ts \
            tests/privacy-policy.test.ts \
            tests/operational-trace-policy.test.ts
      - name: Vitest auth regressions
        run: pnpm exec vitest run tests/auth.login-normalize.test.ts tests/auth.login-session.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Whitespace
        run: git diff --check origin/main...HEAD
      - name: Commit verified implementation
        run: |
          rm -f scripts/finalize_security_baseline.py scripts/finalize_security_baseline_v2.py scripts/finalize_security_baseline_v3.py scripts/finalize_security_baseline_v4.py scripts/finalize_security_baseline_v5.py scripts/finalize_security_baseline_v6.py
          rm -f .github/workflows/validate-security-baseline-pr.yml
          git config user.name "DROPi Security Automation"
          git config user.email "dropi.deliveries@gmail.com"
          git add -A
          git commit -m "security: enforce T1 application baseline"
          git push origin HEAD:m2/security-baseline
