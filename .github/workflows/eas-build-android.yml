name: EAS Runtime Fingerprint Diagnostics

# Temporary diagnostic workflow. It NEVER starts an EAS build or publishes an update.
# It inspects only the resolved Expo config source that differs from the installed development APK.
on:
  pull_request:
    paths:
      - ".github/workflows/eas-build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect resolved Expo config fingerprint delta
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Inspect Expo config source only
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
          BUILD_ID: 7c98a438-9f8e-4b75-a202-e08079ef6206
        run: |
          eas fingerprint:compare --build-id "$BUILD_ID" --json --non-interactive > /tmp/compare.json
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/compare.json', 'utf8'));
          const pick = fp => (fp.sources || []).find(s => (s.filePath || s.id) === 'expoConfig' || (s.reasons || []).includes('expoConfig'));
          const current = pick(data.fingerprint1);
          const build = pick(data.fingerprint2);
          console.log(`current_hash=${data.fingerprint1.hash}`);
          console.log(`build_hash=${data.fingerprint2.hash}`);
          console.log('=== CURRENT EXPO CONFIG SOURCE ===');
          console.log(JSON.stringify(current, null, 2));
          console.log('=== BUILD EXPO CONFIG SOURCE ===');
          console.log(JSON.stringify(build, null, 2));
          NODE
