name: EAS Build — Android APK (development)

# Builds the Android development APK only when explicitly requested.
# The public API URL is injected into the EAS build profile inside the runner so
# the remote build receives the same value used by development OTA publishing.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (development)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate EAS_PROJECT_ID
        run: |
          if [ -z "${{ vars.EAS_PROJECT_ID }}" ] && grep -q "YOUR_EAS_PROJECT_ID" app.config.ts; then
            echo "ERROR: EAS_PROJECT_ID is not configured"
            exit 1
          fi
          echo "EAS_PROJECT_ID is configured"

      - name: Validate EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "ERROR: EXPO_TOKEN is not configured"
            exit 1
          fi
          echo "EXPO_TOKEN is configured"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate public mobile API configuration
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          if [ -z "$EXPO_PUBLIC_API_BASE_URL" ]; then
            echo "ERROR: EXPO_PUBLIC_API_BASE_URL is not configured in GitHub Variables"
            exit 1
          fi
          if echo "$EXPO_PUBLIC_API_BASE_URL" | grep -qE "(localhost|127\.0\.0\.1)"; then
            echo "ERROR: EXPO_PUBLIC_API_BASE_URL cannot target localhost on mobile"
            exit 1
          fi
          if ! echo "$EXPO_PUBLIC_API_BASE_URL" | grep -qE '^https://'; then
            echo "ERROR: EXPO_PUBLIC_API_BASE_URL must use HTTPS"
            exit 1
          fi
          echo "Public mobile API configuration is valid"

      - name: Materialize runtime configuration into EAS development profile
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "eas.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          const profile = config.build?.development;
          if (!profile) throw new Error("Missing EAS development build profile");
          profile.env = {
            ...(profile.env || {}),
            EXPO_PUBLIC_API_BASE_URL: process.env.EXPO_PUBLIC_API_BASE_URL,
          };
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

          node <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync("eas.json", "utf8"));
          const value = config.build?.development?.env?.EXPO_PUBLIC_API_BASE_URL;
          if (!value || value.startsWith("$") || !value.startsWith("https://")) {
            throw new Error("EAS development profile did not receive a valid API base URL");
          }
          console.log("EAS development profile contains a resolved API base URL");
          NODE

      - name: Validate generated Expo public config
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const raw = execFileSync(
            "pnpm",
            ["exec", "expo", "config", "--type", "public", "--json"],
            { encoding: "utf8", env: process.env },
          );
          const config = JSON.parse(raw);
          const value = config.extra?.apiBaseUrl;
          const version = config.version;
          const runtimePolicy = config.runtimeVersion?.policy;
          if (typeof value !== "string" || !value.startsWith("https://")) {
            throw new Error("Expo public config is missing a valid embedded API base URL");
          }
          if (typeof version !== "string" || !/^\d+\.\d+\.\d+$/.test(version) || version === "1.0.0") {
            throw new Error("Development build must use a bumped semantic app version; legacy 1.0.0 is forbidden");
          }
          if (runtimePolicy !== "appVersion") {
            throw new Error("Development build must use the appVersion runtime policy");
          }
          console.log(`Certified development runtime version ${version}`);
          NODE

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EAS CLI
        run: eas --version

      - name: Build Android APK (development)
        run: |
          set +e
          OUTPUT=$(eas build --profile development --platform android --non-interactive --no-wait 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            if echo "$OUTPUT" | grep -qi "used its.*builds from the Free plan\|build quota\|reached your.*build limit"; then
              echo ""
              echo "ERROR: EAS Free plan build quota exhausted for this month."
            fi
          fi
          exit $EXIT_CODE
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
