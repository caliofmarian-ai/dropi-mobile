name: EAS Runtime Fingerprint Diagnostics

# Temporary diagnostic workflow. It NEVER starts an EAS build or publishes an update.
# It isolates the exact fingerprint sources that changed relative to the installed development APK build.
on:
  pull_request:
    paths:
      - ".github/workflows/eas-build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Compare EAS build and current fingerprint sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Isolate changed fingerprint sources
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
          BUILD_ID: 7c98a438-9f8e-4b75-a202-e08079ef6206
        run: |
          eas fingerprint:compare --build-id "$BUILD_ID" --json --non-interactive > /tmp/compare.json
          echo "=== RUNTIME VERDICT ==="
          jq -r '"current_hash=" + .fingerprint1.hash, "build_hash=" + .fingerprint2.hash, "equal=" + ((.fingerprint1.hash == .fingerprint2.hash)|tostring)' /tmp/compare.json
          echo "=== CHANGED FINGERPRINT SOURCES ==="
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/compare.json', 'utf8'));
          const keyOf = (s, i) => s.filePath || s.id || `${s.type || 'source'}#${i}`;
          const toMap = (fp) => {
            const m = new Map();
            (fp.sources || []).forEach((s, i) => m.set(keyOf(s, i), s));
            return m;
          };
          const current = toMap(data.fingerprint1);
          const build = toMap(data.fingerprint2);
          const keys = [...new Set([...current.keys(), ...build.keys()])].sort();
          let count = 0;
          for (const key of keys) {
            const a = current.get(key);
            const b = build.get(key);
            const ah = a?.hash ?? a?.contents ?? null;
            const bh = b?.hash ?? b?.contents ?? null;
            if (JSON.stringify(ah) === JSON.stringify(bh)) continue;
            count++;
            console.log(`${key}\tcurrent=${ah ?? 'MISSING'}\tbuild=${bh ?? 'MISSING'}\tcurrentReasons=${JSON.stringify(a?.reasons ?? [])}\tbuildReasons=${JSON.stringify(b?.reasons ?? [])}`);
          }
          console.log(`changed_source_count=${count}`);
          NODE
