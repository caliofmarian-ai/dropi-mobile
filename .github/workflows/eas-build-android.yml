name: EAS Runtime Fingerprint Diagnostics

# Temporary diagnostic workflow. It NEVER starts an EAS build or publishes an update.
# It compares the existing Android build and the OTA that were created from the same Git commit.
on:
  pull_request:
    paths:
      - ".github/workflows/eas-build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Compare EAS build and OTA fingerprints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Inspect existing APK build metadata
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          BUILD_ID: 7c98a438-9f8e-4b75-a202-e08079ef6206
        run: |
          eas build:view "$BUILD_ID" --json > /tmp/build.json
          echo "=== EXISTING APK BUILD ==="
          jq -r '{id,status,platform,buildProfile,gitCommitHash,runtimeVersion,appVersion,buildNumber} | to_entries[] | "\(.key)=\(.value)"' /tmp/build.json

      - name: Compare build with same-commit OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
          BUILD_ID: 7c98a438-9f8e-4b75-a202-e08079ef6206
          UPDATE_ID: 01a063b7-6afb-7fb0-a56d-aa0028af34ff
        run: |
          eas fingerprint:compare --build-id "$BUILD_ID" --update-id "$UPDATE_ID" --json --non-interactive > /tmp/same.json
          echo "=== BUILD vs SAME-COMMIT OTA ==="
          jq -r 'paths(scalars) as $p | ($p|map(tostring)|join(".")) as $k | select($k|test("fingerprint|runtime|hash|compatible|diff|source|platform|id|reason";"i")) | "\($k)=\(getpath($p))"' /tmp/same.json | head -n 120

      - name: Generate current development-profile fingerprint
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          eas fingerprint:generate --build-profile development --platform android --json --non-interactive > /tmp/current.json
          echo "=== CURRENT DEVELOPMENT-PROFILE FINGERPRINT ==="
          jq -r 'paths(scalars) as $p | ($p|map(tostring)|join(".")) as $k | select($k|test("fingerprint|runtime|hash|source|platform|id";"i")) | "\($k)=\(getpath($p))"' /tmp/current.json | head -n 120

      - name: Compare existing build with current checkout
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
          BUILD_ID: 7c98a438-9f8e-4b75-a202-e08079ef6206
        run: |
          eas fingerprint:compare --build-id "$BUILD_ID" --json --non-interactive > /tmp/current-compare.json
          echo "=== EXISTING BUILD vs CURRENT CHECKOUT ==="
          jq -r 'paths(scalars) as $p | ($p|map(tostring)|join(".")) as $k | select($k|test("fingerprint|runtime|hash|compatible|diff|source|platform|id|reason";"i")) | "\($k)=\(getpath($p))"' /tmp/current-compare.json | head -n 160
