name: EAS Build — Android APK (development)

# Construiește APK-ul de development Android cu Expo EAS
# Se rulează EXCLUSIV manual (workflow_dispatch) pentru a conserva cota EAS Free plan.
# NU se declanșează automat la push pe main.
# APK-ul rezultat este disponibil în dashboard-ul EAS (expo.dev).
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (development)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate EAS_PROJECT_ID
        run: |
          if [ -z "${{ vars.EAS_PROJECT_ID }}" ] && grep -q "YOUR_EAS_PROJECT_ID" app.config.ts; then
            echo "❌ EROARE: EAS_PROJECT_ID nu este configurat"
            exit 1
          fi
          echo "✅ EAS_PROJECT_ID este configurat"

      - name: Validate EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ EROARE: EXPO_TOKEN nu este setat în GitHub Secrets"
            exit 1
          fi
          echo "✅ EXPO_TOKEN este configurat"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate EXPO_PUBLIC_API_BASE_URL
        run: |
          if [ -z "${{ vars.EXPO_PUBLIC_API_BASE_URL }}" ]; then
            echo "❌ EROARE: EXPO_PUBLIC_API_BASE_URL nu este setat în GitHub Variables"
            exit 1
          fi
          if echo "${{ vars.EXPO_PUBLIC_API_BASE_URL }}" | grep -qE "(localhost|127\.0\.0\.1)"; then
            echo "❌ EROARE: EXPO_PUBLIC_API_BASE_URL nu poate fi localhost sau 127.0.0.1 pe mobile"
            exit 1
          fi
          echo "✅ EXPO_PUBLIC_API_BASE_URL este configurat"

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EAS CLI
        run: eas --version

      - name: Build Android APK (development)
        run: |
          set +e
          OUTPUT=$(eas build --profile development --platform android --non-interactive --no-wait 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            if echo "$OUTPUT" | grep -qi "used its.*builds from the Free plan\|build quota\|reached your.*build limit"; then
              echo ""
              echo "❌ EAS Free plan build quota exhausted for this month."
            fi
          fi
          exit $EXIT_CODE
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
