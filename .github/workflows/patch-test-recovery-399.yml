name: Patch Test Recovery 399

on:
  push:
    branches:
      - fix/test-recovery-identifiable-399
    paths:
      - scripts/patch-test-recovery-399.py
      - .github/workflows/patch-test-recovery-399.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/test-recovery-identifiable-399
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: python scripts/patch-test-recovery-399.py
      - run: pnpm install --frozen-lockfile
      - name: Focused recovery tests
        run: >-
          pnpm exec vitest run
          tests/auth.forgot-password.test.ts
          tests/mail.password-recovery-template.test.ts
          tests/test-account-auth-recovery-379-contract.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Server build
        run: pnpm build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/auth-router.ts server/_core/mail.ts lib/auth-context.tsx app/forgot-password.tsx tests/auth.forgot-password.test.ts tests/mail.password-recovery-template.test.ts tests/test-account-auth-recovery-379-contract.test.ts
          git commit -m "AUTH-399: make TEST recovery identifiable" || exit 0
          git push origin HEAD:fix/test-recovery-identifiable-399
