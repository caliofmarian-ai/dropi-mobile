name: Materialize DROPi Planning

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: dropi-planning-materialization
  cancel-in-progress: false

jobs:
  materialize:
    name: Apply & Verify GitHub Planning
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Safety checks
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.repository }}" != "caliofmarian-ai/dropi-mobile" ]; then
            echo "::error::Wrong repository: ${{ github.repository }}"
            exit 1
          fi

          git fetch origin main

          if ! git diff --exit-code origin/main -- canonical/SESSION_HANDOVER.md; then
            echo "::error::canonical/SESSION_HANDOVER.md differs from origin/main — restore it before materializing"
            exit 1
          fi

          EXPECTED="82a6015b8c968645307e36c8e4aa0351515f50333c08a6c5402a7819b7b747e5"
          ACTUAL=$(sha256sum 04.zip | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::04.zip checksum mismatch. Expected=$EXPECTED Got=$ACTUAL"
            exit 1
          fi

          PROTECTED=$(git diff --name-only origin/main -- \
            canonical/ BLUEPRINT/ DROPi_Canonical_Reference/ docs/audits/ \
            app/ server/ drizzle/ 04.zip 2>/dev/null || true)
          if [ -n "$PROTECTED" ]; then
            echo "::error::Protected sources modified on this branch vs origin/main: $PROTECTED"
            exit 1
          fi

          echo "All safety checks passed."

      - name: Run planning tests
        run: |
          set -euo pipefail
          python -m unittest -v tests/test_materialize_github_planning.py
          git diff --check

      - name: Reset historical materialization result snapshot
        run: |
          set -euo pipefail
          rm -f docs/planning/GITHUB_MATERIALIZATION_RESULT.md \
                docs/planning/github_materialization_result.json

      - name: First APPLY
        id: first_apply
        run: |
          set -euo pipefail
          START=$(date +%s)
          python scripts/materialize_github_planning.py \
            --repo caliofmarian-ai/dropi-mobile \
            --repo-root . \
            --apply
          END=$(date +%s)
          echo "runtime=$((END - START))s" >> "$GITHUB_OUTPUT"

      - name: First VERIFY
        id: first_verify
        run: |
          set -euo pipefail
          START=$(date +%s)
          python scripts/materialize_github_planning.py \
            --repo caliofmarian-ai/dropi-mobile \
            --repo-root . \
            --verify
          END=$(date +%s)
          echo "runtime=$((END - START))s" >> "$GITHUB_OUTPUT"

      - name: Second APPLY — idempotency proof
        id: second_apply
        run: |
          set -euo pipefail
          START=$(date +%s)
          python scripts/materialize_github_planning.py \
            --repo caliofmarian-ai/dropi-mobile \
            --repo-root . \
            --apply
          END=$(date +%s)
          echo "runtime=$((END - START))s" >> "$GITHUB_OUTPUT"

      - name: Second VERIFY
        id: second_verify
        run: |
          set -euo pipefail
          START=$(date +%s)
          python scripts/materialize_github_planning.py \
            --repo caliofmarian-ai/dropi-mobile \
            --repo-root . \
            --verify
          END=$(date +%s)
          echo "runtime=$((END - START))s" >> "$GITHUB_OUTPUT"

      - name: Validate results
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json
          from pathlib import Path

          result = json.loads(Path("docs/planning/github_materialization_result.json").read_text(encoding="utf-8"))
          errors = []

          if result.get("verify_result", {}).get("final") is not True:
              errors.append("Final remote verification did not pass")

          idempotency = result.get("summary", {}).get("idempotency", {})
          if idempotency.get("passed") is not True:
              errors.append(f"Idempotency did not pass: {idempotency}")

          second_apply = result.get("second_apply", {})
          for scope in ("labels", "milestones", "issues"):
              created = second_apply.get(scope, {}).get("summary", {}).get("created", 0)
              if created != 0:
                  errors.append(f"Second apply created {created} {scope}")

          if errors:
              raise SystemExit("; ".join(errors))

          print("Materialization + idempotency PASS.")
          PYEOF

      - name: Check result-file restrictions
        run: |
          set -euo pipefail
          ALLOWED_1="docs/planning/GITHUB_MATERIALIZATION_RESULT.md"
          ALLOWED_2="docs/planning/github_materialization_result.json"

          CHANGED=$(git diff --name-only)
          if [ -z "$CHANGED" ]; then
            echo "No files changed; restriction check passed."
            exit 0
          fi

          UNEXPECTED=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ "$f" != "$ALLOWED_1" ] && [ "$f" != "$ALLOWED_2" ]; then
              UNEXPECTED="$UNEXPECTED $f"
            fi
          done <<< "$CHANGED"

          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unexpected tracked files changed:$UNEXPECTED"
            exit 1
          fi
          echo "Result-file restriction check passed."

      - name: Commit result files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CHANGED=$(git diff --name-only -- \
            docs/planning/GITHUB_MATERIALIZATION_RESULT.md \
            docs/planning/github_materialization_result.json)

          if [ -z "$CHANGED" ]; then
            echo "No result files changed; skipping commit."
            exit 0
          fi

          git add docs/planning/GITHUB_MATERIALIZATION_RESULT.md \
                  docs/planning/github_materialization_result.json
          git commit -m "planning: record verified cloud materialization results"
          git push origin HEAD:${{ github.ref_name }}

      - name: Publish job summary
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          FIRST_APPLY_RUNTIME: ${{ steps.first_apply.outputs.runtime }}
          FIRST_VERIFY_RUNTIME: ${{ steps.first_verify.outputs.runtime }}
          SECOND_APPLY_RUNTIME: ${{ steps.second_apply.outputs.runtime }}
          SECOND_VERIFY_RUNTIME: ${{ steps.second_verify.outputs.runtime }}
        run: |
          {
            echo "## DROPi Planning Materialization Summary"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Branch | \`$BRANCH\` |"
            echo "| Commit | \`$COMMIT_SHA\` |"
            echo "| First APPLY | ${FIRST_APPLY_RUNTIME:-n/a} |"
            echo "| First VERIFY | ${FIRST_VERIFY_RUNTIME:-n/a} |"
            echo "| Second APPLY | ${SECOND_APPLY_RUNTIME:-n/a} |"
            echo "| Second VERIFY | ${SECOND_VERIFY_RUNTIME:-n/a} |"
            echo "| Contract | second APPLY creates zero objects |"
          } >> "$GITHUB_STEP_SUMMARY"
